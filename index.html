 ['HBGD038','Avulsion de 4 troisièmes molaires retenues ou à l’état de germe'],['HBGD022','Avulsion d’1 dent permanente sur arcade avec alvéolectomie'],
 ['HBGD034','Avulsion de 2 dents permanentes sur arcade avec alvéolectomie']].forEach(([c,l])=>LIB[c]={c,l,cat:'Chirurgie',m:'FU'});
LIB.YYYY755={c:'YYYY755',l:'Supplément pour avulsion de 4 troisièmes molaires retenues ou à l’état de germe réalisée en cabinet sous anesthésie locale',cat:'Chirurgie',m:''};
Object.entries(AVULSIONS).forEach(([n,c])=>LIB[c]={c,l:`Avulsion de ${n} dent${n>1?'s':''} permanente${n>1?'s':''} sur arcade sans alvéolectomie`,cat:'Chirurgie',m:'FU'});
Object.entries(RADIOS).forEach(([n,c])=>LIB[c]={c,l: n==1 ? 'Radiographie rétroalvéolaire d’un secteur de 1 à 3 dents contiguës' : `Radiographies rétroalvéolaires de ${n} secteurs distincts de 1 à 3 dents contiguës`,cat:'Radiologie',m:'EFU'});
const SECT = {ic:'incisivocanin', pm:'prémolomolaire'};
Object.entries(RESTAU).forEach(([s,o])=>Object.entries(o).forEach(([f,c])=>LIB[c]={c,l:`Restauration d’une dent du secteur ${SECT[s]} sur ${f==3?'3 faces ou plus':f+' face'+(f>1?'s':'')}, matériau en phase plastique`,cat:'Soins',m:'N'}));
const DENTS = {ic:'d’une incisive ou canine permanente', pm1:'d’une 1re prémolaire maxillaire', pm:'d’une prémolaire (autre que 1re max.)', m:'d’une molaire permanente'};
Object.entries(ENDO).forEach(([d,o])=>Object.entries(o).forEach(([v,c])=>{ if(c) LIB[c]={c,l:`${v==='v'?'Exérèse de la pulpe vivante':'Exérèse du contenu canalaire non vivant'} ${DENTS[d]}`,cat:'Endodontie',m:'FNU'}; }));

// Actes éligibles au modificateur 9 (soins conservateurs, 1 à 26 ans)
const MOD9 = new Set('HBFD006 HBFD001 HBFD003 HBFD024 HBFD297 HBFD008 HBFD021 HBFD033 HBFD035 HBFD015 HBFD017 HBFD019 HBFD474 HBFD326 HBBD001 HBBD002 HBBD003 HBBD234 HBFD150 HBFD395 HBFD458 HBFD010 HBMD042 HBMD038 HBMD044 HBMD047 HBMD049 HBMD050 HBMD053 HBMD054 HBMD058'.split(' '));
Object.values(LIB).forEach(a=>{ if(MOD9.has(a.c) && !a.m.includes('9')) a.m+='9'; });

// Base complète des actes bucco-dentaires (CCAM V84, fichier officiel CNAM)
let NB_ACTES = Object.keys(LIB).length;
fetch('ccam-dentaire.json').then(r=>r.json()).then(liste=>{
  liste.forEach(x=>{
    if(!LIB[x.c]) LIB[x.c]={c:x.c, l:x.l, cat:'Base', f:x.f, m:MOD9.has(x.c)?'9':''};
    else LIB[x.c].f = x.f;
    if(!(x.c in PRIX)) PRIX[x.c]=x.p;
  });
  NB_ACTES = liste.length;
  AV_IDX = null;
  if(vue==='code') vCode();
}).catch(e=>console.warn('Base CCAM non chargée', e));

const euro = n => n.toLocaleString('fr-FR',{minimumFractionDigits:2, maximumFractionDigits:2})+' €';

let C = {cat:'Chirurgie', q:'', panier:[], ouvert:false, nAv:1, nRx:1, avQual:'simple', nM3:1, arcM3:'mand', sect:'pm', faces:2, dent:'m', vital:'v', mods:new Set(), ddn:''};
/* Quantités : un même acte peut être fait plusieurs fois (restaurations, endodonties…).
   Les avulsions et les radios n'en ont pas : leur code change déjà avec le nombre de dents. */
const sansQte = c => /^HB(GD|QK)|^YYYY/.test(c);
const qteDe = c => { const p=C.panier.find(x=>x.c===c); return p ? (p.n||1) : 0; };
const nbActes = () => C.panier.reduce((s,p)=>s+(p.n||1), 0);
function qteHTML(c){ return `<div class="qte" role="group" aria-label="Quantité de ${c}"><button type="button" data-qd="-1" data-qc="${c}" aria-label="Un de moins">−</button><b>${qteDe(c)}</b><button type="button" data-qd="1" data-qc="${c}" aria-label="Un de plus">+</button></div>`; }
function changerQte(c, d){
  const p=C.panier.find(x=>x.c===c);
  if(!p){ if(d>0){ C.panier.push({c, n:1}); toast(c+' ajouté'); } }
  else { p.n=(p.n||1)+d; if(p.n<=0) C.panier=C.panier.filter(x=>x!==p); }
  vCode();
}

/* Calcul du panier : actes cumulés à taux plein (dérogation bucco-dentaire),
   N et E en pourcentage sur chaque acte éligible,
   F ou U (exclusifs) une seule fois par séance, sur le premier acte éligible. */
function calcul(){
  const urg = ['F','U'].find(m=>C.mods.has(m));
  let urgPose = false;
  const lignes = C.panier.map(p=>{
    const a = LIB[p.c], n = p.n||1, unitaire = PRIX[p.c] ?? 0, mods=[];
    let un = unitaire;
    ['N','E','9'].forEach(m=>{ if(C.mods.has(m) && a.m.includes(m)){ un += unitaire*MODS[m].pct; mods.push(m);} });
    let montant = Math.round(un*100)/100*n;
    if(urg && !urgPose && a.m.includes(urg)){ montant += MODS[urg].fixe; mods.push(urg); urgPose=true; }
    montant = Math.round(montant*100)/100;
    return {c:p.c, l:a.l, n, base:Math.round(unitaire*n*100)/100, mods, montant};
  });
  const total = Math.round(lignes.reduce((s,x)=>s+x.montant,0)*100)/100;
  return {lignes, total};
}

function vCode(){
  const q=C.q.trim().toLowerCase();
  let liste;
  if(q){
    const sans=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const mots=sans(q).split(/\s+/).filter(Boolean);
    liste = Object.values(LIB).filter(a=>{ const t=sans(a.c+' '+a.l+' '+(a.f||'')); return mots.every(w=>t.includes(w)) || rechercheNombre(q,a); }).slice(0,40);
  }
  else liste = ACTES.filter(a=>a.cat===C.cat);
  // Un nouveau rendu du même écran ne rejoue pas l'animation d'entrée (c'était le « flash »)
  const calme = !!app.querySelector('.vue.v-code');
  app.innerHTML = `<div class="vue v-code${calme?' calme':''}">
    <header class="top"><div class="logo">${logo}Codage express</div></header>
    <label class="recherche">${ICO.loupe}<input id="q" type="search" placeholder="Rechercher un acte ou un code" value="${esc(C.q)}" aria-label="Rechercher un acte"></label>
    ${q?'':`<div class="cats" role="tablist">${CATS.map(c=>`<button class="cat" aria-pressed="${c===C.cat}" data-c="${c}">${c}</button>`).join('')}</div>`}
    ${q?'':outilsCategorie()}
    <div id="liste">${liste.map(carteActe).join('') || `<p class="sous" style="margin-top:20px">Aucun acte trouvé. Décris-le à l'assistant, il cherchera pour toi.</p><button class="btn ia" style="margin-top:12px;width:100%" id="versIA">Demander à l'assistant</button>`}</div>
    <p class="sous" style="font-size:.8rem;margin-top:16px">Recherche dans ${NB_ACTES} actes bucco-dentaires. Tarifs : base de remboursement CCAM V84 (31/07/2026), fichier officiel CNAM, métropole.</p>
    <div style="height:${C.panier.length?150:20}px"></div>
  </div>${panierHTML()}`;
  const qi=$('#q'); qi.oninput=()=>{C.q=qi.value; const p=qi.selectionStart; vCode(); const n=$('#q'); n.focus(); n.setSelectionRange(p,p);};
  app.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{C.cat=b.dataset.c;vCode()});
  if($('#versIA')) $('#versIA').onclick=()=>{IA.brouillon=C.q; aller('ia')};
  brancherOutils(); brancherPanier();
  app.querySelectorAll('button.acte').forEach(b=>b.onclick=()=>basculer(b.dataset.c));
  app.querySelectorAll('[data-qd]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); changerQte(b.dataset.qc, Number(b.dataset.qd)); });
}
function rechercheNombre(q,a){ const m=q.match(/(\d+)\s*dent/); return m && a.l.toLowerCase().startsWith(`avulsion de ${m[1]} dent`); }
function prixHTML(c){ return PRIX[c]!=null ? `<span class="prix">${euro(PRIX[c])}</span>` : `<span class="prix">non remboursable</span>`; }
function carteActe(a){
  const n=qteDe(a.c), infos=`<span><span class="code">${a.c}</span>${prixHTML(a.c)}<span class="lib" style="display:block">${a.l}</span></span>`;
  if(n && !sansQte(a.c)) return `<div class="acte dans">${infos}${qteHTML(a.c)}</div>`;
  return `<button class="acte ${n?'dans':''}" data-c="${a.c}">${infos}<span class="plus">${n?'✓':'+'}</span></button>`;
}
function resultat(c, vide, qte){
  const bouton = !c ? '' : (qte && qteDe(c)) ? qteHTML(c) : `<button class="mini" data-ajout="${c}">${qteDe(c)?'Ajouté ✓':'Ajouter'}</button>`;
  return `<div class="resultat-code"><span><span class="code">${c||'—'}</span>${c?` <span class="prix fort">${PRIX[c]!=null?euro(PRIX[c]):'non remboursable'}</span>`:''}<small>${c?LIB[c].l:vide}</small></span>${bouton}</div>`;
}
function stepper(id, val, label, max){
  return `<div class="rangee"><span class="sous">${label}</span><div class="stepper"><button data-step="${id}" data-d="-1" aria-label="Moins">−</button><input class="nb" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="${max}" value="${val}" data-nb="${id}" aria-label="${label} (1 à ${max})" autocomplete="off"><button data-step="${id}" data-d="1" aria-label="Plus">+</button></div></div>`;
}

function outilsCategorie(){
  if(C.cat==='Chirurgie'){
    return `<div class="compteur"><h3>Avulsions de dents permanentes</h3><p class="sous" style="font-size:.88rem">Sur arcade, dans la même séance : un seul code pour toutes les dents.</p>
      <div class="seg trois" data-k="avQual">${[['simple','Sans alvéolectomie'],['alveo','Avec alvéolectomie'],['separation','Séparation des racines']].map(([v,t])=>`<button data-v="${v}" aria-pressed="${C.avQual===v}">${t}</button>`).join('')}</div>
      ${stepper('nAv', C.nAv, 'Nombre de dents', MAX_COMPTEUR.nAv())}
      <p class="limite">${MAX_COMPTEUR.nAv()} dents au maximum${C.avQual==='separation'?' avec séparation des racines':''}</p>
      <div id="res-nAv">${resultatCompteur('nAv')}</div></div>
    <div class="compteur"><h3>Dents de sagesse retenues ou à l’état de germe</h3><p class="sous" style="font-size:.88rem">Troisièmes molaires, dans la même séance : un seul code pour toutes.</p>
      <div class="seg quatre" data-k="nM3">${[1,2,3,4].map(n=>`<button data-v="${n}" aria-pressed="${C.nM3===n}">${n} dent${n>1?'s':''}</button>`).join('')}</div>
      ${C.nM3===1?`<div class="seg" data-k="arcM3">${[['max','Maxillaire'],['mand','Mandibulaire']].map(([v,t])=>`<button data-v="${v}" aria-pressed="${C.arcM3===v}">${t}</button>`).join('')}</div>`:''}
      ${resultat(C.nM3===1 ? (C.arcM3==='max'?'HBGD018':'HBGD004') : M3[C.nM3])}
      ${C.nM3===4?`<p class="sous" style="font-size:.85rem;margin-top:12px">Au cabinet, sous anesthésie locale : ajoute aussi le supplément.</p>${resultat('YYYY755')}`:''}</div>`;
  }
  if(C.cat==='Radiologie'){
    return `<div class="compteur"><h3>Radios rétroalvéolaires</h3><p class="sous" style="font-size:.88rem">Un secteur = 1 à 3 dents contiguës.</p>
      ${stepper('nRx', C.nRx, 'Nombre de secteurs', MAX_COMPTEUR.nRx())}
      <p class="limite">14 secteurs au maximum (limite de la CCAM)</p>
      <div id="res-nRx">${resultatCompteur('nRx')}</div></div>`;
  }
  if(C.cat==='Soins'){
    return `<div class="compteur"><h3>Restauration en phase plastique</h3><p class="sous" style="font-size:.88rem">Composite ou amalgame, sans ancrage radiculaire.</p>
      <div class="seg" data-k="sect">${[['ic','Incisivo-canin'],['pm','Prémolo-molaire']].map(([v,t])=>`<button data-v="${v}" aria-pressed="${C.sect===v}">${t}</button>`).join('')}</div>
      <div class="seg" data-k="faces">${[[1,'1 face'],[2,'2 faces'],[3,'3 faces ou +']].map(([v,t])=>`<button data-v="${v}" aria-pressed="${C.faces==v}">${t}</button>`).join('')}</div>
      ${resultat(RESTAU[C.sect][C.faces], '', true)}</div>`;
  }
  if(C.cat==='Endodontie'){
    return `<div class="compteur"><h3>Traitement endodontique</h3>
      <div class="seg" data-k="dent">${[['ic','Inc./canine'],['pm1','1re PM max.'],['pm','Prémolaire'],['m','Molaire']].map(([v,t])=>`<button data-v="${v}" aria-pressed="${C.dent===v}">${t}</button>`).join('')}</div>
      <div class="seg" data-k="vital">${[['v','Pulpe vivante'],['n','Non vivante']].map(([v,t])=>`<button data-v="${v}" aria-pressed="${C.vital===v}">${t}</button>`).join('')}</div>
      ${resultat(ENDO[C.dent][C.vital], 'Code à ajouter à la base', true)}</div>`;
  }
  return '';
}
// Bornes des compteurs : codes existant dans la CCAM V84
const MAX_COMPTEUR = { nAv:()=>C.avQual==='separation' ? 4 : 32, nRx:()=>14 };
const UNITE_COMPTEUR = { nAv:'dents', nRx:'secteurs' };
function codeAvulsion(n, qual){
  return avulsion(n,'perm',qual) || (qual==='simple' ? AVULSIONS[n] : qual==='alveo' ? {1:'HBGD022',2:'HBGD034'}[n] : undefined);
}
function resultatCompteur(k){
  return k==='nAv' ? resultat(codeAvulsion(C.nAv, C.avQual), 'Base CCAM en cours de chargement…') : resultat(RADIOS[C.nRx], '');
}
function brancherAjoutCode(racine){
  racine.querySelectorAll('[data-ajout]').forEach(b=>b.onclick=()=>{ if(!C.panier.some(p=>p.c===b.dataset.ajout)) basculer(b.dataset.ajout); else toast('Déjà dans la sélection'); });
  racine.querySelectorAll('[data-qd]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); changerQte(b.dataset.qc, Number(b.dataset.qd)); });
}
function majCompteur(k){
  const r=$('#res-'+k); if(!r) return;
  r.innerHTML = resultatCompteur(k); brancherAjoutCode(r);
}
function brancherOutils(){
  app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const k=b.dataset.step; C[k]=Math.min(MAX_COMPTEUR[k](),Math.max(1,C[k]+Number(b.dataset.d))); vCode();});
  app.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=s.dataset.k; C[k]= (k==='faces'||k==='nM3')?Number(b.dataset.v):b.dataset.v; if(k==='avQual') C.nAv=Math.min(C.nAv, MAX_COMPTEUR.nAv()); vCode();}));
  // saisie directe du nombre, bloquée au-delà du maximum possible
  app.querySelectorAll('[data-nb]').forEach(inp=>{
    const k=inp.dataset.nb;
    let precedent=String(C[k]);
    inp.onfocus=()=>inp.select();
    inp.oninput=()=>{
      const brut=inp.value.replace(/\D/g,'');
      if(brut===''){ inp.value=''; return; }
      const n=parseInt(brut,10), max=MAX_COMPTEUR[k]();
      if(n>max){ inp.value=precedent; toast(`${max} ${UNITE_COMPTEUR[k]} au maximum`); return; }
      inp.value=String(n); precedent=inp.value;
      if(n>=1){ C[k]=n; majCompteur(k); }
    };
    inp.onchange=inp.onblur=()=>{ const n=parseInt(inp.value,10), avant=C[k], affiche=inp.value; C[k]=Math.min(MAX_COMPTEUR[k](), Math.max(1, isNaN(n)?1:n)); inp.value=String(C[k]); precedent=inp.value; if(C[k]!==avant || affiche!==inp.value) majCompteur(k); };
    inp.onkeydown=e=>{ if(e.key==='Enter') inp.blur(); };
  });
  brancherAjoutCode(app);
}
function basculer(c){
  const i=C.panier.findIndex(p=>p.c===c);
  if(i>=0) C.panier.splice(i,1); else { C.panier.push({c, n:1}); toast(c+' ajouté'); }
  vCode();
}
function panierHTML(){
  if(!C.panier.length) return '';
  const dispo = ['N','9','E','F','U'].filter(m=>C.panier.some(p=>(LIB[p.c].m||'').includes(m)));
  const {lignes,total} = calcul();
  return `<div class="panier"><div class="in">
    <div class="panier-haut"><button class="panier-tete" id="pt" aria-expanded="${C.ouvert}"><b>Sélection<span class="badge">${nbActes()}</span></b><span class="total-tete">${euro(total)}</span></button>${C.ouvert?`<button class="fermer-p" id="ptX" aria-label="Fermer la sélection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`:''}</div>
    ${C.ouvert?`<div class="panier-corps">
      <div class="ddn-c"><label for="ddnC">Date de naissance du patient</label><input id="ddnC" class="date-saisie" inputmode="numeric" placeholder="JJ/MM/AAAA" maxlength="10" value="${C.ddnTxt||''}" autocomplete="off"><small>${C.ddn?ageTexte():'Les modificateurs liés à l’âge (N, E, 9) s’appliquent tout seuls. Rien n’est enregistré.'}</small></div>
      ${lignes.map(x=>`<div class="p-acte"><span><span class="code">${x.c}</span>${x.n>1?`<span class="fois">×${x.n}</span>`:''}${x.mods.map(m=>` <span class="mcode">${m}</span>`).join('')}<br><span style="color:#B9CDD3">${x.l}</span>${sansQte(x.c)?'':`<span style="display:flex;margin-top:8px">${qteHTML(x.c)}</span>`}</span><span class="p-droite"><b>${euro(x.montant)}</b>${x.montant!==x.base?`<small>base ${euro(x.base)}</small>`:''}<button data-retire="${x.c}" aria-label="Retirer ${x.c}">×</button></span></div>`).join('')}
      ${lignes.some(x=>PRIX[x.c]==null)?'<p class="mod-titre">Les actes non remboursables comptent pour 0 € dans le total.</p>':''}
      ${dispo.length?`<p class="mod-titre">Modificateurs possibles pour ces actes</p>${dispo.map(m=>`<div class="mod"><span class="mcode grand">${m}</span><span style="flex:1"><b>${MODS[m].t}</b><small>${MODS[m].d}${C.ddn && 'NE9'.includes(m)?' · réglé selon l’âge':''}</small></span><button class="switch" role="switch" aria-checked="${C.mods.has(m)}" data-m="${m}" aria-label="${MODS[m].t}"></button></div>`).join('')}`:''}
    </div>
    <div class="total"><span>Total de la séance<small>Actes cumulés à taux plein</small></span><b>${euro(total)}</b></div>
    <div class="deux-btn"><button class="copier sec" id="vider">Nouveau patient</button><button class="copier" id="copier">Copier</button></div>`:''}
  </div></div>`;
}
function ageAns(ddn){
  if(!ddn) return null; const n=new Date(ddn+'T12:00'), a=new Date();
  let ans=a.getFullYear()-n.getFullYear(); if(a.getMonth()<n.getMonth() || (a.getMonth()===n.getMonth() && a.getDate()<n.getDate())) ans--;
  return ans;
}
function appliquerAge(){
  const age=ageAns(C.ddn); ['N','E','9'].forEach(m=>C.mods.delete(m));
  if(age==null || age<0) return;
  if(age<13) C.mods.add('N');
  if(age<5) C.mods.add('E');
  if(age>=1 && age<=26) C.mods.add('9');
}
function ageTexte(){
  const age=ageAns(C.ddn); if(age==null||age<0) return 'Date invalide';
  const m=['N','E','9'].filter(x=>C.mods.has(x));
  return `${age} an${age>1?'s':''} : ${m.length?'modificateur'+(m.length>1?'s ':' ')+m.join(', ')+' appliqué'+(m.length>1?'s':'')+' aux actes éligibles':'aucun modificateur d’âge'}. N ne vaut que pour les dents permanentes : désactive-le si besoin.`;
}
function brancherPanier(){
  if(!$('#pt')) return;
  const basculerPanier=()=>{
    const avant=$('.panier .in',app).offsetHeight;
    C.ouvert=!C.ouvert; vCode();
    const b=$('.panier .in',app); if(!b) return;
    const a=anime(b, {height:[avant+'px', b.offsetHeight+'px']}, RESSORT);
    if(a){ b.style.overflow='hidden'; a.finished.then(()=>{ b.style.height=''; b.style.overflow=''; }, ()=>{}); }
  };
  $('#pt').onclick=basculerPanier;
  if($('#ptX')) $('#ptX').onclick=basculerPanier;
  app.querySelectorAll('[data-retire]').forEach(b=>b.onclick=()=>basculer(b.dataset.retire));
  app.querySelectorAll('.switch').forEach(s=>s.onclick=()=>{
    const m=s.dataset.m;
    if(C.mods.has(m)) C.mods.delete(m);
    else { C.mods.add(m); if(m==='F') C.mods.delete('U'); if(m==='U') C.mods.delete('F'); }
    vCode();
  });
  const di=$('#ddnC'); if(di) brancherDate(di, v=>{ C.ddnTxt=v; C.ddn=dateISO(v); appliquerAge(); vCode(); if(!v){ const n=$('#ddnC'); n&&n.focus(); } });
  if($('#vider')) $('#vider').onclick=()=>{ C.panier=[]; C.mods=new Set(); C.ddn=''; C.ddnTxt=''; C.ouvert=false; vCode(); toast('Sélection et date de naissance effacées'); };
  if($('#copier')) $('#copier').onclick=()=>{
    const {lignes,total}=calcul();
    const txt=lignes.map(x=>`${x.c}${x.n>1?' ×'+x.n:''}${x.mods.length?' (modif. '+x.mods.join(', ')+')':''} : ${euro(x.montant)}`).join('\n')+`\nTotal : ${euro(total)}`;
    navigator.clipboard?.writeText(txt).then(()=>toast('Codes et total copiés')).catch(()=>toast('Copie impossible sur ce navigateur'));
  };
}

/* ---------------------------------------------------------
   Assistant de cotation
   1. Un moteur local qui comprend la demande (acte, nombre, dent,
      contexte) et raisonne sur la base CCAM V84 complète.
   2. Si le relais IA est configuré (IA_URL), l'IA rédige la réponse
      à partir des codes trouvés par le moteur local.
   Aucune donnée patient n'est envoyée.
--------------------------------------------------------- */
const IA = {fil:[], brouillon:'', attente:false};
const IA_URL = 'https://drill-ia.ryan-naal-rn.workers.dev/';

const norm = t => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’`]/g,"'");
const NOMBRES = {un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,onze:11,douze:12,treize:13,quatorze:14,quinze:15,seize:16,'dix-sept':17,'dix-huit':18,'dix-neuf':19,vingt:20};
const fmt = c => PRIX[c]!=null ? euro(PRIX[c]) : 'non remboursable';

// --- Lecture de la demande ---------------------------------
function analyser(texte){
  let t = ' '+norm(texte)+' ';
  Object.entries(NOMBRES).sort((a,b)=>b[0].length-a[0].length).forEach(([m,n])=>{ t=t.replace(new RegExp('\\b'+m+'\\b','g'), String(n)); });
  const A = {t};
  // nombre d'éléments : « 18 dents », « 3 radios », « 2 faces », « 2 secteurs »
  const nb = t.match(/(\d+)\s*(dents?|racines?|molaires?|canines?|incisives?|premolaires?|avulsions?|extractions?)\b/);
  A.n = nb ? Number(nb[1]) : null;
  A.faces = (t.match(/(\d)\s*faces?/)||[])[1]; A.faces = A.faces?Number(A.faces):null;
  if(!A.faces){ if(/\bmod\b|\bmodl?\b|\bodm\b/.test(t)) A.faces=3; else if(/\b(mo|od|do|om)\b/.test(t)) A.faces=2; else if(/\b(occlusale?|o)\b/.test(t) && /compo|restau|obtur|amalg|carie|soin/.test(t)) A.faces=1; }
  A.secteurs = Number((t.match(/(\d+)\s*(secteurs?|radios?|retros?|cliches?|rx)\b/)||[])[1])||null;
  A.sextants = Number((t.match(/(\d+)\s*sextants?/)||[])[1])||null;
  // numéro de dent (notation FDI), en évitant les nombres suivis de « dents »
  const dents=[...t.matchAll(/\b([1-4][1-8]|[5-8][1-5])\b(?!\s*(dents?|faces?|ans?|secteurs?|h\b|heures?|sextants?|racines?|molaires?))/g)].map(m=>Number(m[1]));
  A.dent = dents[0]||null; A.dents=dents;
  A.age = Number((t.match(/(\d+)\s*ans?\b/)||[])[1])||null;
  A.temp = /lait|temporaire|deciduale/.test(t) || (A.dent && A.dent>=51);
  A.urgDim = /dimanche|ferie/.test(t); A.urgNuit = /\bnuit\b|minuit|2[0-3]\s*h|\b[0-7]\s*h\b/.test(t);
  A.aod = /\baod\b|avk|anticoag|apixaban|rivaroxaban|dabigatran|eliquis|xarelto|pradaxa|warfarine|previscan|fluindione/.test(t);
  A.ald = /\bald\b|affection longue/.test(t);
  return A;
}
function typeDent(d){
  if(!d) return null;
  const q=Math.floor(d/10), u=d%10;
  if(q>=5) return u<=3 ? 'tic' : 'tm';               // temporaire : incisive/canine ou molaire
  if(u<=3) return 'ic';
  if(u===4 && (q===1||q===2)) return 'pm1';
  if(u<=5) return 'pm';
  return 'm';
}
function typeMots(t){
  if(/premiere premolaire max|1re premolaire max|1ere premolaire max/.test(t)) return 'pm1';
  if(/premolaire/.test(t)) return 'pm';
  if(/molaire/.test(t)) return 'm';
  if(/incisive|canine|anterieure|bloc incisivo/.test(t)) return 'ic';
  return null;
}

// Index des avulsions à partir des libellés officiels
let AV_IDX=null;
function indexAvulsions(){
  AV_IDX=[];
  Object.values(LIB).forEach(a=>{
    const l=norm(a.l);
    const m=l.match(/^avulsion (?:d'1|de\s*(\d+)(?: dents?)?(?: a (\d+))?) dents? (permanentes?|temporaires?|ankylosees?) sur arcade(.*)$/);
    if(!m) return;
    const min=m[1]?Number(m[1]):1, max=m[2]?Number(m[2]):min;
    let type = /^perm/.test(m[3]) ? 'perm' : /^temp/.test(m[3]) ? 'temp' : 'ankylose';
    let qual = /avec alveolectomie/.test(m[4]) ? 'alveo' : /separation/.test(m[4]) ? 'separation' : 'simple';
    AV_IDX.push({c:a.c,min,max,type,qual});
  });
}
function avulsion(n,type,qual){
  if(!AV_IDX || AV_IDX.length<10) indexAvulsions();
  return (AV_IDX.find(x=>x.type===type && x.qual===qual && n>=x.min && n<=x.max)||{}).c;
}

// --- Raisonnement par type d'acte ---------------------------
function raisonner(A){
  const t=A.t, R={texte:[], codes:[], alternatives:[], questions:[]};
  const code = (c, pourquoi) => { if(c && LIB[c]) R.codes.push({c,pourquoi}); };
  const alt = (c, pourquoi) => { if(c && LIB[c]) R.alternatives.push({c,pourquoi}); };

  // Conversation
  if(/^\s*(bonjour|salut|hello|coucou|bonsoir|hey)\b/.test(t) && t.trim().split(/\s+/).length<=3){ R.texte.push('Bonjour ! Décris-moi l’acte réalisé (par exemple « j’ai extrait 18 dents » ou « composite MOD sur la 36 ») et je te donne le code, le prix et les modificateurs à mettre.'); return R; }
  if(/^\s*(merci|top|parfait|super|nickel|ok)\b/.test(t) && t.trim().split(/\s+/).length<=4){ R.texte.push('Avec plaisir. Tu peux ajouter les codes à ta sélection pour avoir le total de la séance.'); return R; }
  const modQ = t.match(/modificateur\s*([a-z0-9])\b/);
  if(modQ || /c'est quoi (le|les) modif|quels? modificateurs?/.test(t)){
    const k = modQ ? modQ[1].toUpperCase() : null;
    const liste = k && MODS[k] ? [k] : Object.keys(MODS);
    R.texte.push(liste.map(m=>`Modificateur ${m} : ${MODS[m].t.toLowerCase()} (${MODS[m].d}).`).join('<br>'));
    R.texte.push('Dans Codage express, entre la date de naissance du patient : N, E et 9 s’activent tout seuls selon l’âge. F et U sont à activer à la main en cas d’urgence.');
    return R;
  }

  const ext = /extra|avuls|enlev|arrach|retir|avulsion/.test(t);
  const sagesse = /sagesse|troisieme molaire|3e molaire|3eme molaire|dds\b/.test(t) || (ext && A.dents.some(d=>[18,28,38,48].includes(d)));
  const incluse = /inclu|enclav|retenu|germe|semi|sous[- ]muqueu|osteotomie|lambeau/.test(t);

  const degagement = /degag|traction|exposition/.test(t);
  if((ext || (sagesse && !degagement)) && sagesse && (incluse || !/arcade|erupt|sortie|sur l'arcade/.test(t))){
    const n = A.n || Math.max(1, A.dents.filter(d=>[18,28,38,48].includes(d)).length) || 1;
    if(n===1){
      const mand = /mandib|du bas|en bas/.test(t) || A.dents.some(d=>d===38||d===48);
      const maxi = /maxill|du haut|en haut/.test(t) || A.dents.some(d=>d===18||d===28);
      if(mand && !maxi) code('HBGD004','dent de sagesse mandibulaire retenue ou à l’état de germe');
      else if(maxi && !mand) code('HBGD018','dent de sagesse maxillaire retenue ou à l’état de germe');
      else { code('HBGD004','si elle est mandibulaire'); code('HBGD018','si elle est maxillaire'); R.questions.push('Elle était en haut ou en bas ?'); }
    } else {
      code({2:'HBGD025',3:'HBGD021',4:'HBGD038'}[Math.min(n,4)], `${n} dents de sagesse retenues dans la même séance : un seul code pour l’ensemble`);
      if(n===4) alt('YYYY755','supplément si les 4 ont été faites au cabinet sous anesthésie (vérifie les conditions)');
    }
    R.texte.push('La CCAM a des codes spécifiques pour les troisièmes molaires retenues ou à l’état de germe.' + (incluse?'':' Je pars du principe qu’elle n’était pas sur l’arcade.'));
    if(!incluse){ const c=avulsion(n,'perm','simple'); alt(c,'si la dent était en fait sortie sur l’arcade : avulsion simple'); }
    return R;
  }

  if(ext && /canine/.test(t) && incluse){ code(A.n>=2?'HBGD015':'HBGD014', 'canine retenue ou à l’état de germe'); return R; }
  if(ext && /racine/.test(t) && /inclu/.test(t)){ code({1:'HBGD016',2:'HBGD466',3:'HBGD299',4:'HBGD102',5:'HBGD159',6:'HBGD465'}[A.n||1],'racine incluse'); return R; }

  if(ext){
    const n = A.n || (A.dents.length || null);
    if(!n){ R.texte.push('Combien de dents as-tu extraites dans la séance ? La CCAM code les avulsions par nombre de dents, avec un seul code pour l’ensemble.'); code(avulsion(1,A.temp?'temp':'perm','simple'),'si c’était une seule dent'); return R; }
    const type = A.temp ? 'temp' : /ankylos/.test(t) ? 'ankylose' : 'perm';
    let qual = /alveolect|alveolot|fraisa|osteotom|lambeau/.test(t) ? 'alveo' : /separ|section|coronoradic/.test(t) ? 'separation' : 'simple';
    if(type!=='perm') qual = type==='ankylose' ? 'separation' : 'simple';
    const c = avulsion(n,type,qual);
    const quoi = type==='temp' ? `${n} dent${n>1?'s':''} temporaire${n>1?'s':''}` : type==='ankylose' ? `${n} dent${n>1?'s':''} ankylosée${n>1?'s':''}` : `${n} dent${n>1?'s':''} permanente${n>1?'s':''}`;
    if(c){
      R.texte.push(`Pour ${quoi} extraite${n>1?'s':''} dans la même séance${type==='perm'? (qual==='alveo'?', avec alvéolectomie':qual==='separation'?', avec séparation des racines':', sans alvéolectomie'):''}, c’est un seul code : <b>${c}</b> (${fmt(c)}).` + (n>1?' Les avulsions se codent par nombre total de dents, pas dent par dent.':''));
      code(c, LIB[c].l);
      if(type==='perm' && qual==='simple'){ alt(avulsion(n,'perm','alveo'),'si tu as dû faire une alvéolectomie'); alt(avulsion(n,'perm','separation'),'si tu as séparé les racines'); }
      if(type==='perm' && qual!=='simple') alt(avulsion(n,'perm','simple'),'sans alvéolectomie');
      if(!A.temp && /enfant|\d+\s*ans/.test(t) && A.age && A.age<12) R.questions.push('S’il s’agit de dents de lait, dis-le moi : les codes sont différents.');
    } else R.texte.push(`Je ne trouve pas de code pour ${quoi} dans la base. Vérifie le nombre, ou découpe en plusieurs séances.`);
    return R;
  }

  // Implants
  if(/implant/.test(t) && !/couronne|prothese|supra|pilier|depose|retrait|degagement|cicatris/.test(t)){
    const n=Math.max(1,A.n||Number((t.match(/(\d+)\s*implants?/)||[])[1])||1);
    const enfant = /enfant/.test(t) || (A.age!=null && A.age<18);
    const c = enfant ? {1:'LBLD075',2:'LBLD066',3:'LBLD281',4:'LBLD117'}[Math.min(n,4)] : {1:'LBLD015',2:'LBLD010',3:'LBLD013',4:'LBLD004',5:'LBLD020',6:'LBLD025'}[Math.min(n,6)];
    code(c, LIB[c]?.l);
    R.texte.push(`Pose de ${n} implant${n>1?'s':''} ${enfant?'chez l\u2019enfant':'chez l\u2019adulte'} : <b>${c}</b> (${fmt(c)}). Attention, la prise en charge par l\u2019Assurance maladie est limitée à certaines indications : vérifie les conditions avant de coter.`);
    if(!enfant) alt({1:'LBLD075',2:'LBLD066',3:'LBLD281',4:'LBLD117'}[Math.min(n,4)],'si le patient est un enfant');
    return R;
  }

  // Restaurations
  if(/compo|restau|obtur|amalgam|carie|cvi|verre ionomere|inlay|onlay|angle/.test(t) && !/canal|endo|devital|pulpe/.test(t)){
    if(/inlay|onlay/.test(t)){ code('HBMD351','inlay-onlay composite ou alliage non précieux, 2 faces ou plus'); alt('HBMD460','inlay-onlay céramique ou alliage précieux'); return R; }
    const sect = A.dent ? (['ic','tic'].includes(typeDent(A.dent))?'ic':'pm') : (typeMots(t)==='ic'?'ic':typeMots(t)?'pm':null);
    const angles = Number((t.match(/(\d)\s*angles?/)||[])[1]) || (/angle/.test(t)?1:0);
    if(angles && sect!=='pm'){ code(angles>=2?'HBMD047':'HBMD044', `restauration incisivo-canine sur ${angles>=2?2:1} angle${angles>=2?'s':''}`); return R; }
    if(!A.faces){ R.questions.push('Combien de faces ? (1, 2, ou 3 et plus, par exemple MOD)'); }
    const f = Math.min(A.faces||1,3);
    if(sect){
      const c=RESTAU[sect][f]; code(c, `${f===3?'3 faces ou plus':f+' face'+(f>1?'s':'')}, secteur ${sect==='ic'?'incisivo-canin':'prémolo-molaire'}`);
      R.texte.push(`Composite ou amalgame${A.dent?' sur la '+A.dent:''} : <b>${c}</b> (${fmt(c)}).`);
      if(!A.faces) [1,2,3].filter(x=>x!==f).forEach(x=>alt(RESTAU[sect][x], `${x===3?'3 faces ou plus':x+' face'+(x>1?'s':'')}`));
    } else {
      R.questions.push('Sur quelle dent ? (numéro, ou incisive / prémolaire / molaire)');
      code(RESTAU.pm[f],'si c’est une prémolaire ou une molaire'); code(RESTAU.ic[f],'si c’est une incisive ou une canine');
    }
    R.texte.push('Le modificateur 9 (+30 %) s’applique si le patient a entre 1 et 26 ans, et N (+15,7 %) sur dent permanente avant 13 ans.');
    return R;
  }

  // Endodontie
  if(/canal|endo|devital|pulpect|pulpe|pulpite|necro|mortif|retraitement|biopulp|pulpotomie|parodontite apicale|lesion apicale/.test(t)){
    const td = A.dent ? typeDent(A.dent) : (A.temp ? (typeMots(t)==='m'?'tm':'tic') : typeMots(t));
    if(/pulpotomie|biopulpotomie/.test(t)){ if(A.temp||td==='tm'||td==='tic') code('HBFD006','biopulpotomie sur dent temporaire'); else code('HBFD425','biopulpotomie sur dent permanente mature'); return R; }
    const nonVivante = /necro|mortif|non vivante|retraitement|granulome|lesion apicale|parodontite apicale|abces|desobtur/.test(t);
    const vivante = /pulpite|vivante|biopulp|pulpectomie|vitale/.test(t);
    const v = nonVivante ? 'n' : 'v';
    if(td==='tic'||td==='tm'){
      const c = {tic:{v:'HBFD017',n:'HBFD015'}, tm:{v:'HBFD019',n:'HBFD474'}}[td][v];
      code(c, `dent temporaire, pulpe ${v==='v'?'vivante':'non vivante'}`); return R;
    }
    if(!td){ R.questions.push('Sur quelle dent ? Le code dépend du type de dent (incisive/canine, prémolaire, molaire).'); ['ic','pm','m'].forEach(k=>code(ENDO[k][v], {ic:'incisive ou canine',pm:'prémolaire',m:'molaire'}[k])); }
    else { const c=ENDO[td][v]; code(c, `${DENTS[td].replace(/^d’une /,'')}, ${v==='v'?'pulpe vivante':'contenu canalaire non vivant'}`); R.texte.push(`Traitement endodontique${A.dent?' de la '+A.dent:''} : <b>${c}</b> (${fmt(c)}).`); }
    if(!nonVivante && !vivante) R.questions.push('La pulpe était vivante (pulpite) ou nécrosée ? J’ai mis « vivante » par défaut.');
    if(/retraitement|desobtur/.test(t)) R.texte.push('Pour un retraitement, on code l’exérèse du contenu non vivant. La désobturation canalaire existe aussi mais n’est pas remboursable.');
    alt('HBQK303','forfait radios endo : préopératoire, peropératoire et finale');
    alt('HBQK040','forfait radios endo : préopératoire et finale');
    return R;
  }

  // Radiologie
  if(/radio|retro|pano|panoramique|cone beam|cbct|occlusale|rx\b|cliche/.test(t)){
    if(/pano/.test(t)) code('HBQK002','radiographie panoramique');
    else if(/cone|cbct/.test(t)) code('LAQK027','cone beam (prise en charge selon les cas)');
    else if(/occlusal/.test(t)) code('HBQK001','radiographie occlusale');
    else {
      const n = A.secteurs || A.n || 1; const c = RADIOS[Math.min(n,14)];
      code(c, `${n} secteur${n>1?'s':''} de 1 à 3 dents contiguës`);
      R.texte.push('Un secteur, c’est 1 à 3 dents contiguës sur le même cliché. Pour une endo, utilise plutôt les forfaits radios endo.');
      alt('HBQK040','forfait endo : préopératoire et finale'); alt('HBQK303','forfait endo : pré, per et finale');
    }
    if(A.age && A.age<5) R.texte.push('Patient de moins de 5 ans : ajoute le modificateur E (+49 %).');
    return R;
  }

  // Parodontologie
  if(/detartr|surfac|dsr|assainissement/.test(t) && !/abces/.test(t)){
    if(/surfac|dsr|assainissement/.test(t)){ const n=Math.min(A.sextants||1,3); code({1:'HBJA003',2:'HBJA171',3:'HBJA634'}[n], `${n===3?'3 sextants ou plus':n+' sextant'+(n>1?'s':'')}`); }
    else code('HBJD001','détartrage et polissage');
    return R;
  }

  // Abcès
  if(/abces|cellulite|collection|drainage|incision/.test(t)){
    if(/parodont/.test(t)) code('HBJB001','abcès parodontal');
    else { code('LCJA003','collection périmaxillaire ou périmandibulaire, par voie intrabuccale'); alt('HBJB001','si c’était un abcès parodontal'); }
    return R;
  }

  // Recherche générale
  const SYN = {couronne:'couronne',bridge:'bridge',implant:'implant',prothese:'prothese',appareil:'prothese amovible',stellite:'chassis metallique',gouttiere:'gouttiere',frein:'frein',biopsie:'biopsie',sinus:'sinus',greffe:'greffe',kyste:'kyste',scellement:'scellement',vernis:'vernis',fluor:'fluor',mainteneur:'mainteneur',inlay:'inlay',facette:'facette',blanchiment:'eclaircissement',eclaircissement:'eclaircissement',contention:'contention',attelle:'contention',suture:'suture',reimplant:'reimplantation',fracture:'fracture',apicectomie:'apicectomie',resection:'resection'};
  const mots = t.split(/[^a-z0-9]+/).filter(w=>w.length>3 && !['avec','sans','pour','dans','une','des','les','fait','faire','faite','patient','dent','dents','code','ccam','quel','quelle','pose','mise','realise','realisee','acte','quoi','comment','coter','cotation'].includes(w)).map(w=>SYN[w]||w);
  const debut = w => new RegExp('(^|[^a-z])'+w.replace(/[^a-z0-9]/g,''));
  const rx = mots.map(w=>[debut(w), debut(w.slice(0,5))]);
  const scores = Object.values(LIB).map(a=>{ const l=norm(a.l+' '+(a.f||'')); return {a, s:rx.reduce((s,[r1,r2])=>s+(r1.test(l)?2:r2.test(l)?1:0),0)}; }).filter(x=>x.s>0).sort((x,y)=>y.s-x.s || (PRIX[y.a.c]!=null)-(PRIX[x.a.c]!=null)).slice(0,4);
  if(scores.length){ const complet = scores[0].s>=2*mots.length; R.texte.push(complet ? 'Voici les actes de la CCAM qui correspondent :' : 'Je n’ai pas reconnu l’acte avec certitude. Voici les actes de la CCAM qui s’en rapprochent le plus :'); scores.forEach(x=>code(x.a.c, '')); R.questions.push('Si ce n’est pas ça, précise l’acte, le nombre et la dent.'); }
  else R.texte.push('Je n’ai rien trouvé. Reformule avec l’acte, le nombre de dents et le numéro de dent (ex. « endo sur la 46, dent nécrosée »).');
  return R;
}

function contexte(A,R){
  if(A.urgDim) R.texte.push('Urgence un dimanche ou un jour férié : modificateur F (+19,06 €, une fois par séance).');
  else if(A.urgNuit) R.texte.push('Urgence de nuit (20 h – 8 h) : modificateur U (+25,15 €, une fois par séance).');
  if(A.aod && /extra|avuls|chirurg|enlev/.test(A.t)) { R.alternatives.push({c:'YYYY614', pourquoi:'supplément si le patient est en ALD et sous AOD ou AVK (une fois par séance)'}); }
  if(A.age!=null && !/radio|pano|modificateur/.test(A.t)){
    const m=[]; if(A.age<13) m.push('N (dent permanente)'); if(A.age>=1 && A.age<=26) m.push('9');
    if(m.length && /compo|restau|obtur|endo|canal|pulp|devital|carie|coiff/.test(A.t)) R.texte.push(`Patient de ${A.age} ans : modificateur${m.length>1?'s':''} ${m.join(' et ')} à ajouter.`);
  }
}

function carteIA(x){ return `<button class="acte" data-ajout-ia="${x.c}" style="margin-top:8px"><span><span class="code">${x.c}</span>${prixHTML(x.c)}<span class="lib" style="display:block">${x.pourquoi||LIB[x.c].l}</span></span><span class="plus">+</span></button>`; }

/* --- Questions de prescription --- */
function intentionPrescription(texte){
  const t=norm(texte);
  if(/\bcode|ccam|coter|cotation|tarif|prix|combien (ca|ça) (coute|rapporte)|modificateur/.test(t)) return false;
  if(/prescri|antibio|ordonnance|que (donner|mettre|faire)|quoi (donner|prescrire|faire)|faut-?il|dois-?je|je (peux|dois)|puis-?je|on peut|arret|stopp|suspend|antalg|antidouleur|ibuprof|paracetamol|amoxi|allergi|enceinte|grossesse|allait|bain de bouche|prophylax|risque|inr|conduite a tenir/.test(t)) return true;
  const rep=RECO.analyserQuestion(texte); const M=RECO.MOTIF[rep.motif];
  if(rep.ttt.some(x=>x!=='aucun') || rep.atcd.some(x=>x!=='aucun') || rep.allergies.some(x=>x!=='aucune') || ['enceinte','allaite'].includes(rep.profil)) return true;
  return !!M && !['Acte prévu'].includes(M.groupe) && !/\d+\s*dents?/.test(t);
}
function repondrePrescription(texte){
  const rep = RECO.analyserQuestion(texte);
  const t = norm(texte), hyp = [];
  const antithrombo = (rep.ttt||[]).some(x=>RECO.ANTITHROMBO.includes(x));
  if(!rep.motif && antithrombo && /avuls|extrai|extraction|enlever|arracher|chirurg|operer|implant/.test(t)) rep.motif = /implant/.test(t)?'implant':'avulsion';
  if(!rep.motif){
    return {html:`<p>Je peux t’aider, mais j’ai besoin de la situation clinique : quel acte ou quelle affection (abcès, cellulite, alvéolite, avulsion, péricoronarite, candidose…) ? Précise aussi l’âge si c’est un enfant, les allergies, les antécédents et les traitements.</p>`, brut:'', ia:true};
  }
  if(!rep.profil){ rep.profil='adulte'; hyp.push('adulte'); }
  if(rep.profil==='enfant' && !rep.poids) hyp.push('poids non précisé (doses à calculer)');
  if(rep.profil==='enceinte' && !rep.terme){ rep.terme='avant'; hyp.push('terme non précisé'); }
  if(rep.alvAmbigu) hyp.push('alvéolite sèche, sans pus (si elle est suppurée, dis-le moi : la règle change)');
  if(rep.allergies[0]==='aucune') hyp.push('pas d’allergie');
  if(rep.atcd[0]==='aucun') hyp.push('pas d’antécédent particulier');
  if(rep._hyp && rep._hyp.length) hyp.push(...rep._hyp);
  if(RECO.AVEC_EXTENSION.includes(rep.motif) && !rep.extension.length){ rep.extension=['aucun']; hyp.push('pas de signe d’extension (ni pus, ni tuméfaction, ni fièvre)'); }
  if(rep.motif==='cellulite' && !rep.gravite){ rep.gravite=['aucun']; hyp.push('pas de signe de gravité'); }
  const M=RECO.MOTIF[rep.motif];
  if(M && M.chir && antithrombo && !rep.risque_hemo){ rep.risque_hemo='faible'; hyp.push('acte à risque hémorragique faible'); }
  const O = RECO.decider(rep);
  const strip = x=>String(x);
  let h = '';
  // Réponse directe à « je peux… ? » sous antithrombotique
  const alerteAT = O.alertes.find(a=>/antiplaquettaire|Antivitamine|Anticoagulant|Héparine|Bithérapie/i.test(a.t));
  if(antithrombo && alerteAT && /peux|puis|possible|arret|stopp|suspend|faut/.test(t)) h += `<p><b>${alerteAT.t}.</b> ${alerteAT.d}</p>`;
  if(O.hospit) h += `<p><b>Adresser à l’hôpital :</b> un signe de gravité est présent.</p>`;
  h += `<p><b>${O.atb?'Antibiotique : oui.':'Antibiotique : non.'}</b> ${O.pourquoi.map(strip).join(' ')}</p>`;
  if(O.gestes.length) h += `<p><b>Geste :</b> ${O.gestes.join(' ')}</p>`;
  if(O.lignes.length) h += `<p><b>À prescrire :</b></p><ul class="rx">${O.lignes.map(l=>`<li><b>${l.med}</b>${l.decoche?' (facultatif)':''} : ${l.pos}, ${l.qsp.toLowerCase()}</li>`).join('')}</ul>`;
  const autres = O.alertes.filter(a=>a!==alerteAT && (a.n!=='info' || /écarté|Grossesse|moins de 6 ans/.test(a.t))).slice(0,5);
  if(autres.length) h += autres.map(a=>`<p><b>${a.t} :</b> ${a.d}</p>`).join('');
  if(hyp.length) h += `<p class="sous" style="font-size:.85rem">J’ai supposé : ${hyp.join(', ')}. Si ce n’est pas le cas, précise-le.</p>`;
  h += `<button class="btn sec" data-ouvrir-prescri style="margin-top:10px;width:100%">Ouvrir dans Prescri'Dent</button>`;
  IA.derniere = rep;
  return {html:h, brut:RECO.resumer(rep,O), contexte:RECO.resumer(rep,O)+(hyp.length?'\nHypothèses : '+hyp.join(', '):''), ia:true};
}

/* Réponse immédiate du moteur local ; le texte de l'IA vient ensuite l'enrichir s'il arrive à temps. */
function repondreLocal(texte){
  const poso = reponsePosologieMX(texte);
  if(poso) return poso;
  if(intentionPrescription(texte)){
    const R0 = repondrePrescription(texte);
    const suite = R0.html.includes('<ul class="rx">') ? R0.html.slice(R0.html.indexOf('<p><b>À prescrire')) : R0.html.slice(R0.html.indexOf('<button'));
    return {...R0, suite, requete: R0.contexte ? {question:texte, pistes:[], contexte:R0.contexte} : null};
  }
  const A = analyser(texte), R = raisonner(A); contexte(A,R);
  const vus=new Set(); R.codes=R.codes.filter(x=>!vus.has(x.c)&&vus.add(x.c)); R.alternatives=R.alternatives.filter(x=>!vus.has(x.c)&&vus.add(x.c));
  let suite = R.codes.map(carteIA).join('');
  if(R.alternatives.length) suite += `<p class="sous" style="margin-top:12px;font-size:.88rem">Selon le cas :</p>`+R.alternatives.map(carteIA).join('');
  if(R.questions.length) suite += `<p style="margin-top:12px">${R.questions.join('<br>')}</p>`;
  const pistes=[...R.codes,...R.alternatives].map(x=>({code:x.c, libelle:LIB[x.c].l, tarif:PRIX[x.c], note:x.pourquoi}));
  return {html: R.texte.map(p=>`<p>${p}</p>`).join('') + suite, suite, brut: R.texte.join(' ').replace(/<[^>]+>/g,''), ia:true, requete:{question:texte, pistes}};
}
async function affinerIA(m, hist){
  const ctrl = new AbortController(), minuteur = setTimeout(()=>ctrl.abort(), 15000);
  try{
    const r = await fetch(IA_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...m.requete, historique:hist}),signal:ctrl.signal});
    const j = await r.json();
    if(j.reponse) return `<p>${esc(j.reponse).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n+/g,'</p><p>')}</p>` + m.suite;
    console.warn('Relais IA : pas de réponse', j);
  }catch(e){ console.warn('Relais IA indisponible', e); }
  finally{ clearTimeout(minuteur); }
  return null;
}

function vScanCadrage(){
  app.innerHTML = `<div class="vue">

  const zone=$('#zone'), cadre=$('#cadre');
  const placer=()=>{ const c=SC.cadre; Object.assign(cadre.style,{left:c.x*100+'%',top:c.y*100+'%',width:c.w*100+'%',height:c.h*100+'%'}); };
  placer();
  let geste=null;
  const borne=(v,a,b)=>Math.max(a,Math.min(b,v));
  zone.addEventListener('pointerdown',e=>{
    const r=zone.getBoundingClientRect(), coin=e.target.dataset?.c;
    if(!coin && e.target!==cadre) return;
    e.preventDefault(); zone.setPointerCapture(e.pointerId);
    geste={coin, x0:e.clientX, y0:e.clientY, c0:{...SC.cadre}, W:r.width, H:r.height};
  });
  zone.addEventListener('pointermove',e=>{
    if(!geste) return; e.preventDefault();
    const dx=(e.clientX-geste.x0)/geste.W, dy=(e.clientY-geste.y0)/geste.H, c0=geste.c0, m=.08; let c={...c0};
    if(!geste.coin){ c.x=borne(c0.x+dx,0,1-c0.w); c.y=borne(c0.y+dy,0,1-c0.h); }
    else{
      if(geste.coin.includes('w')){ c.x=borne(c0.x+dx,0,c0.x+c0.w-m); c.w=c0.x+c0.w-c.x; }
      if(geste.coin.includes('e')){ c.w=borne(c0.w+dx,m,1-c0.x); }
      if(geste.coin.includes('n')){ c.y=borne(c0.y+dy,0,c0.y+c0.h-m); c.h=c0.y+c0.h-c.y; }
      if(geste.coin.includes('s')){ c.h=borne(c0.h+dy,m,1-c0.y); }
    }
    SC.cadre=c; placer();
  });
  const fin=()=>{ geste=null; }; zone.addEventListener('pointerup',fin); zone.addEventListener('pointercancel',fin);
  $('#ret').onclick=$('#autre').onclick=()=>{ SC=nouveauSC(); vScan(); };
  $('#lire').onclick=lirePhoto;
}

async function lirePhoto(){
  if(SC.lecture) return;
  const img=$('#photo'); if(!img||!img.naturalWidth) return;
  const c=SC.cadre, sx=c.x*img.naturalWidth, sy=c.y*img.naturalHeight, sw=c.w*img.naturalWidth, sh=c.h*img.naturalHeight;
  const k=Math.min(1, 1600/Math.max(sw,sh)), cv=document.createElement('canvas');
  cv.width=Math.round(sw*k); cv.height=Math.round(sh*k);
  cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
  const b64=cv.toDataURL('image/jpeg',.85).split(',')[1];
  SC.lecture=true; SC.erreur=''; vScanCadrage();
  try{
    const ctrl=new AbortController(), minuteur=setTimeout(()=>ctrl.abort(),60000);
    const r=await fetch(IA_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'lecture', image:b64, mime:'image/jpeg'}),signal:ctrl.signal}).finally(()=>clearTimeout(minuteur));
    const j=await r.json();
    if(j.statut===503||j.statut===429) throw new Error('les serveurs de Google sont surchargés en ce moment, réessaie dans une minute');
    if(!r.ok || j.erreur) throw new Error([j.erreur||'Relais IA indisponible', j.statut?'code '+j.statut:'', j.detail||''].filter(Boolean).join(' — '));
    if(!j.medicaments?.length){ SC.lecture=false; SC.erreur='Aucun médicament lisible dans le cadre. Rapproche-toi, évite les reflets, ou saisis-les à la main.'; return vScanCadrage(); }
    SC.lignes=j.medicaments.map(m=>[m.nom,m.dosage].filter(Boolean).join(' ')+(m.posologie?' — '+m.posologie:''));
    SC.image=null; SC.lecture=false; SC.etape='liste'; vScan();
    toast('Vérifie la liste avant d’analyser');
  }catch(e){
    SC.lecture=false; SC.erreur='L’IA n’a pas pu lire la photo ('+(e.name==='AbortError'?'pas de réponse au bout d’une minute':e.message)+'). Réessaie, ou saisis les médicaments à la main.'; vScanCadrage();
  }
}

async function chargerFiches(){

const PASTILLE = {OK:['ok','Compatible'], APEC:['apec','À prendre en compte'], PE:['pe','Précaution'], ASDEC:['asdec','Déconseillé'], CI:['ci','Contre-indiqué']};
function vScanResultat(){
  const R=SC.R, src=s=>s?` <span class="src">${esc(s)}</span>`:'';
  const ico = n => n==='info'?ICO.info:ICO.alerte;
  const terrain = alertesGroupees(R.terrain.map(a=>({n:a.n, html:`<b>${esc(a.t)}</b>${esc(a.d)}${src(a.src)}`})));
  // regroupés par couleur : à éviter (rouge), avec précaution (orange), compatibles (vert) ; la classe reste indiquée sous le nom
  const COUL = {CI:'forte', ASDEC:'forte', PE:'moy', APEC:'moy', OK:'info'}, RANG = {CI:0, ASDEC:1, PE:2, APEC:3, OK:4};
  const tous = R.presc.flatMap(G=>G.items.map((it,k)=>({it, g:G.groupe, k}))).map((x,i)=>({...x, i})).sort((a,b)=>RANG[a.it.niveau]-RANG[b.it.niveau] || a.i-b.i);
  const ligneP = ({it, g}) => {
    const [cl,lib]=PASTILLE[it.niveau];
    const nom = `<span>${esc(it.nom)}<small class="pr-cl">${esc(g)}</small></span>`;
    const det = it.raisons.map(r=>`<li><span class="niv ${PASTILLE[r.niv][0]}">${PASTILLE[r.niv][1]}</span> <b>${esc(r.meds.join(', '))}</b> — ${esc(r.txt)}${src(r.src)}</li>`).join('') + (it.note?`<li>${esc(it.note)}</li>`:'');
    return det ? `<details class="pr ${cl}"><summary>${nom}<span class="niv ${cl}">${lib}</span></summary><ul>${det}</ul></details>`
               : `<div class="pr ok">${nom}<span class="niv ok">${lib}</span></div>`;
  };

  }).join('');
  const bouche = R.bouche.map(b=>`<li><b>${esc(b.t)}</b>${esc(b.d)}</li>`).join('');
  const pfP = RECO.depuisScanner(SC.meds), prefN = pfP.ttt.length + pfP.atcd.length;
  app.innerHTML = `<div class="vue">
    <header class="top"><button class="retour" id="ret">${ICO.retour}Modifier la liste</button><button class="retour" id="raz" style="padding-left:12px">Nouveau scan</button></header>
    <h2 style="margin-top:6px">Ce que ce traitement change pour toi</h2>
    ${cadreHTML('Ses médicaments', `
      <p class="sous" style="font-size:.88rem">Classe, indications et contre-indications tirées du RCP officiel. Touche un médicament.</p>
      <div id="mesMeds" class="presc" style="margin-top:8px">${htmlMesMeds()}</div>

    ${cadreHTML('Avant un geste', terrain || `<p class="sous" style="margin-top:10px">Rien de particulier repéré dans ce traitement.</p>`)}
    ${cadreHTML('Si tu prescris', `<p class="sous" style="font-size:.88rem">Touche une ligne pour voir pourquoi.</p>${presc}`)}
    ${bouche?cadreHTML('En bouche', `<ul class="gestes bouche">${bouche}</ul>`):''}
    <section class="rubrique"><header class="rubrique-t"><h2>Assistant</h2></header>
    <div id="iaZone" style="margin-top:12px">${SC.ia?`<div class="bulle ia-bulle">${SC.ia}</div>`:`<button class="btn ia" id="demIA" style="width:100%">${SC.iaAttente?'<span class="roue"></span>L’assistant réfléchit…':'Demander une synthèse à l’assistant'}</button>`}</div></section>
    <p class="demo">Médicaments : base de données publique des médicaments (ANSM, ${MEDS.dateBDPM()||'2026'}) et RCP officiels. Interactions : thésaurus ANSM (15/09/2023, dernière version publiée) et RCP. Terrain : HAS 2026, SFCO 2015. Ne remplace ni le Vidal ni l’avis du prescripteur.</p>
    <div style="height:90px"></div>
  </div>

    fus('ttt',pf.ttt,'aucun'); fus('atcd',pf.atcd,'aucun');
    Object.entries(pf.sous).forEach(([k,v])=>{ if(Array.isArray(v)) P.rep[k]=[...new Set([...(P.rep[k]||[]), ...v])]; else if(P.rep[k]==null) P.rep[k]=v; });
    SC.depuisPrescri=false;
    aller('prescri'); if(prefN) toast('Traitements pré-cochés');
  };
  const re=$('#reIA'); if(re) re.onclick=()=>{ SC.ia=''; vScanResultat(); $('#demIA')?.click(); };

      clearTimeout(minuteur);
      const brut=await r.text(); let j={}; try{ j=JSON.parse(brut); }catch(_){ throw new Error('réponse illisible du relais (code '+r.status+')'); }
      if(j.reponse) html = `<p>${esc(j.reponse).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n+/g,'</p><p>')}</p>`;

    SC.iaAttente=false; SC.ia=html; if(vue==='scan' && SC.etape==='resultat') vScanResultat();
  };
}

let guide = null;
function ouvrirGuide(){
  if(guide) return;
  const retourFocus = document.activeElement;
  const g = document.createElement('div');
  g.className = 'guide';
  g.setAttribute('role','dialog'); g.setAttribute('aria-modal','true'); g.setAttribute('aria-label','Guide de Drill');
  g.innerHTML = `<div class="guide-haut"><div class="guide-prog" aria-hidden="true">${DIAPOS.map(()=>'<i><b></b></i>').join('')}</div><button class="guide-passer" id="gPasser">Passer</button></div>
    <div class="guide-piste" id="gPiste">${DIAPOS.map((d,i)=>`<section class="diapo ${d.classe||''}" aria-label="${i+1} sur ${DIAPOS.length} : ${d.court}"><div class="in">
      <div class="decor ${d.decor}" aria-hidden="true">${d.scene()}</div>
      <h2>${d.titre}</h2><p class="chapo">${d.chapo}</p>
      ${d.etapes?`<ol class="etapes">${d.etapes.map((e,k)=>`<li><b>${k+1}</b><span>${e}</span></li>`).join('')}</ol>`:''}
      ${d.note?`<p class="guide-note">${ICO_BOUCLIER}<span>${d.note}</span></p>`:''}
      ${d.cta?`<button class="essayer" data-essai="${i}">${d.cta}${ICO.fleche}</button>`:''}
    </div></section>`).join('')}</div>
    <div class="guide-bas"><button class="guide-prec" id="gPrec" aria-label="Écran précédent">${ICO.retour}</button>
      <div class="guide-points">${DIAPOS.map((d,i)=>`<button data-pt="${i}" aria-label="Aller à l’écran ${i+1} : ${d.court}"><i></i></button>`).join('')}</div>
      <button class="guide-suiv" id="gSuiv">Suivant${ICO.fleche}</button></div>
    <p id="gAnnonce" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></p>`;
  document.body.appendChild(g);
  const piste = $('#gPiste', g);
  guide = { el:g, piste, i:-1, ctrls:[], retourFocus };

  const vers = (i, doux=true) => { i=Math.max(0,Math.min(DIAPOS.length-1,i)); piste.scrollTo({left:i*piste.clientWidth, behavior:(doux && !sansMouvement.matches)?'smooth':'auto'}); };
  let attente = 0;
  piste.addEventListener('scroll', ()=>{ cancelAnimationFrame(attente); attente=requestAnimationFrame(()=>{ const i=Math.round(piste.scrollLeft/Math.max(1,piste.clientWidth)); if(i!==guide?.i) activer(i); }); }, {passive:true});
  $('#gPasser', g).onclick = ()=>fermerGuide();
  $('#gPrec', g).onclick = ()=>vers(guide.i-1);
  $('#gSuiv', g).onclick = ()=>{ if(guide.i>=DIAPOS.length-1) fermerGuide(); else vers(guide.i+1); };
  g.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>vers(+b.dataset.pt));
  g.querySelectorAll('[data-essai]').forEach(b=>b.onclick=()=>{ const d=DIAPOS[+b.dataset.essai]; fermerGuide(); d.go(); });
  guide.clavier = (e)=>{ if(e.key==='ArrowRight') vers(guide.i+1); else if(e.key==='ArrowLeft') vers(guide.i-1); else if(e.key==='Escape') fermerGuide(); };
  document.addEventListener('keydown', guide.clavier);
  guide.retour = ()=>fermerGuide(true);
  try{ history.pushState({guide:true},''); }catch(e){}
  window.addEventListener('popstate', guide.retour);
  window.addEventListener('resize', guide.recale = ()=>vers(guide.i,false));

  anime(g, {opacity:[0,1], y:[40,0]}, {type:'spring', visualDuration:.4, bounce:.15});
  activer(0);
  $('#gSuiv', g).focus({preventScroll:true});
}

function activer(i){
  const g = guide; if(!g) return;
  g.i = i;
  g.ctrls.forEach(c=>c.stop && c.stop()); g.ctrls = [];
  const el = g.el, d = g.el.querySelectorAll('.diapo')[i];
  el.querySelectorAll('.guide-prog i').forEach((s,k)=>s.classList.toggle('fait', k<=i));
  el.querySelectorAll('[data-pt]').forEach((b,k)=>b.setAttribute('aria-current', k===i));
  $('#gPrec', el).disabled = i===0;
  $('#gSuiv', el).innerHTML = i===DIAPOS.length-1 ? 'C’est parti' : 'Suivant'+ICO.fleche;
  $('#gAnnonce', el).textContent = `Écran ${i+1} sur ${DIAPOS.length} : ${DIAPOS[i].court}`;
  if(i===DIAPOS.length-1) marquerGuideVu();
  if(!MOTION) return;
  const fixe = sansMouvement.matches;
  const q = s => [...d.querySelectorAll(s)];
  const go = (cible, kf, o) => { if(!cible || (Array.isArray(cible) && !cible.length)) return; g.ctrls.push(MOTION.animate(cible, kf, fixe ? {duration:0} : o)); };
  const boucle = (cible, kf, o) => go(cible, kf, {repeat:Infinity, ease:'easeInOut', ...o});
  // le texte arrive en cascade
  if(!fixe) el.querySelectorAll('.diapo').forEach((x,k)=>{ if(k!==i) x.querySelectorAll(TEXTE_DIAPO).forEach(t=>{ t.style.opacity=0; }); });
  go(q(TEXTE_DIAPO), {opacity:[0,1], y:[26,0]}, {duration:.95, delay:MOTION.stagger(.13, {startDelay:.12}), ease:[.22,1,.36,1]});
  // puis la mini-démo de l'écran
  const fin = (kf) => fixe ? kf.map(()=>kf[kf.length-2]) : kf;
  switch(i){
    case 0:
      boucle(q('.m-orbite'), {rotate:[0,360]}, {duration:18, ease:'linear'});
      boucle(q('.m-orbite span'), {rotate:[0,-360]}, {duration:18, ease:'linear'});
      boucle(q('.m-logo'), {scale:[1,1.07,1]}, {duration:2.4});
      boucle(q('.m-main'), {x:[30,-30], opacity:[0,1,1,0]}, {duration:1.6, repeatDelay:.5});
      break;
    case 1: {
      const T1 = {duration:3.4, times:[0,.3,.36,.88,1]};
      boucle(q('.m-sel'), {opacity:fin([0,0,1,1,0])}, T1);
      boucle(q('.m-ok'), {opacity:fin([0,0,1,1,0]), scale:fin([.4,.4,1,1,.4])}, T1);
      boucle(q('.m-doigt'), {opacity:[0,1,1,0,0], scale:[1.4,1,.8,1,1]}, {duration:3.4, times:[0,.12,.3,.4,1]});
      boucle(q('.m-prog .m-fait'), {opacity:fin([0,0,1,1,0]), scale:fin([.5,.5,1,1,.5])}, {duration:3.4, times:[0,.38,.45,.88,1]});
      boucle(q('.m-prog .r i'), {scaleX:fin([.5,.5,.75,.75,.5])}, {duration:3.4, times:[0,.4,.5,.88,1]});
      break; }
    case 2:
      boucle(q('.m-doigt'), {opacity:[0,1,1,0,0], scale:[1.4,1,.8,1,1]}, {duration:3, times:[0,.15,.3,.42,1]});
      boucle(q('#gFav1'), {scale:[1,1,.96,1,1]}, {duration:3, times:[0,.24,.3,.38,1]});
      boucle(q('.m-toast'), {opacity:fin([0,0,1,1,0]), x:['-50%','-50%','-50%','-50%','-50%'], y:fin([-12,-12,0,0,-12])}, {duration:3, times:[0,.32,.4,.86,1]});
      break;
    case 3: {
      const h = (q('.m-papier')[0]?.offsetHeight || 140) - 6;
      boucle(q('.m-laser'), {y:[0,h,h], opacity:fin([0,1,1,0,0])}, {duration:3, times:[0,.08,.55,.62,1], y:{duration:3, times:[0,.6,1]}});
      q('.m-puce').forEach((p,k)=>boucle(p, {opacity:fin([0,0,1,1,0]), x:fin([24,24,0,0,0])}, {duration:3, times:[0,.4+k*.12,.5+k*.12,.9,1]}));
      break; }
    case 4:
      q('.m-plus i').forEach((p,k)=>boucle(p, {opacity:fin([0,0,1,1,0]), scale:fin([.4,.4,1,1,.4])}, {duration:3.4, times:[0,.2+k*.22,.26+k*.22,.9,1]}));
      boucle(q('.m-panier'), {opacity:fin([0,0,1,1,0]), y:fin([12,12,0,0,0])}, {duration:3.4, times:[0,.5,.58,.9,1]});
      break;
    case 5:
      boucle(q('.m-bulle.moi'), {opacity:fin([0,1,1,0]), y:fin([12,0,0,0])}, {duration:4, times:[0,.08,.9,1]});
      boucle(q('.m-pts'), {opacity:[0,0,1,1,0,0]}, {duration:4, times:[0,.16,.2,.4,.44,1]});
      if(!fixe) boucle(q('.m-pts i'), {y:[0,-4,0]}, {duration:.6, delay:MOTION.stagger(.12)});
      boucle(q('.m-bulle.lui'), {opacity:fin([0,0,1,1,0]), y:fin([12,12,0,0,0])}, {duration:4, times:[0,.42,.5,.9,1]});
      break;
    case 6:
      q('.m-plus i').forEach((p,k)=>boucle(p, {opacity:fin([0,0,1,1,0]), scale:fin([.4,.4,1,1,.4])}, {duration:3.4, times:[0,.25+k*.25,.31+k*.25,.9,1]}));
      break;
    case 7:
      go(q('.m-bravo'), {scale:[.4,1]}, {type:'spring', bounce:.5, visualDuration:.5});
      go(q('.m-bravo path'), {strokeDashoffset:[1,0]}, {duration:.5, delay:.25, ease:[.16,1,.3,1]});
      if(!fixe) q('.m-confetti i').forEach((c,k)=>{ const a=k/22*Math.PI*2, r=90+(k%4)*28;
        go(c, {x:[0,Math.cos(a)*r], y:[0,Math.sin(a)*r+30], rotate:[0,(k%2?1:-1)*240], opacity:[0,1,1,0]}, {duration:1.4, delay:.3, ease:[.16,1,.3,1], opacity:{duration:1.4, delay:.3, times:[0,.1,.7,1]}}); });
      break;
  }
}

function fermerGuide(depuisHistorique){
  const g = guide; if(!g || g.ferme) return;
  g.ferme = true;
  g.ctrls.forEach(c=>c.stop && c.stop());
  document.removeEventListener('keydown', g.clavier);
  window.removeEventListener('popstate', g.retour);
  window.removeEventListener('resize', g.recale);
  marquerGuideVu();
  guide = null;
  if(!depuisHistorique && history.state && history.state.guide){ try{ history.back(); }catch(e){} }
  const fin = ()=>{ g.el.remove(); if(vue==='accueil'){ vAccueil(); $('#goGuide')?.focus({preventScroll:true}); } else if(g.retourFocus && g.retourFocus.isConnected) g.retourFocus.focus({preventScroll:true}); };
  const a = anime(g.el, {opacity:[1,0], y:[0,30]}, {duration:.22, ease:'easeIn'});
  if(a) a.finished.then(fin, fin); else fin();
}

aller('accueil');
// Écran de lancement : visible un court instant à l'ouverture de l'app
(function(){
  const sp=document.getElementById('splash'); if(!sp){ const b=document.getElementById('couleurBarre'); if(b) b.content='#F5F8F8'; return; }
  const reduit=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const barre=document.getElementById('couleurBarre');
  const fondu=(delai)=>setTimeout(()=>{ sp.classList.add('fini'); if(barre) barre.content='#F5F8F8'; setTimeout(()=>sp.remove(), 500); }, delai);
  if(reduit) return fondu(300);
  if(!MOTION){ sp.classList.add('sans-motion'); return fondu(1100); }
  const A=MOTION.animate, img=sp.querySelector('img'), logoL=sp.querySelector('.logo-l');
  // le logo arrive en rebondissant, un halo s'en échappe, les lettres montent une à une
  A(img, {opacity:[0,1]}, {duration:.35});
  A(img, {scale:[.35,1], rotate:[-14,0]}, {type:'spring', bounce:.4, visualDuration:.85});
  sp.querySelectorAll('.halo').forEach((h,k)=>A(h, {scale:[.8,1,1.9], opacity:[0,0,.7,0]}, {duration:1.7+k*.25, ease:'easeOut', scale:{duration:1.7+k*.25, times:[0,.2+k*.12,1], ease:[.16,1,.3,1]}, opacity:{duration:1.7+k*.25, times:[0,.18+k*.12,.3+k*.12,1]}}));
  A(sp.querySelectorAll('.mot i'), {y:['110%','0%'], opacity:[0,1]}, {duration:.75, delay:MOTION.stagger(.08,{startDelay:.45}), ease:[.16,1,.3,1]});
  // l'écran de lancement se referme sur le logo et dévoile l'accueil
  setTimeout(()=>{
    if(barre) barre.content='#F5F8F8';
    A(logoL, {scale:[1,1.08,0]}, {duration:.8, ease:[.65,0,.35,1], times:[0,.35,1]});
    A(sp.querySelector('.mot'), {opacity:[1,0], y:[0,10]}, {duration:.3, ease:'easeIn'});
    A(sp, {clipPath:['circle(150% at 50% 46%)','circle(0% at 50% 46%)']}, {duration:.85, ease:[.65,0,.35,1]})
      .finished.then(()=>sp.remove(), ()=>sp.remove());
    const elements=[...document.querySelectorAll('#app .vue > *:not(.outils), #app .outils > *')].slice(0,9);
    A(elements, {opacity:[0,1], y:[22,0]}, {duration:.8, delay:MOTION.stagger(.08,{startDelay:.4}), ease:[.22,1,.36,1]});
    A(document.querySelector('.onglets'), {y:[90,0]}, {duration:.8, delay:.55, ease:[.22,1,.36,1]});
  }, 1500);
})();

<script>
/* Bulle de l'assistant : au-dessus des onglets et des barres d'action de l'écran (bouton, sélection, saisie) */
(function(){
  const bulle = document.getElementById('bulleIA'), onglets = document.querySelector('.onglets');
  if(!bulle || !onglets) return;
  // Ouverture de l'assistant, comme le lancement de Drill : le violet part de la bulle et envahit l'écran,
  // la bulle vient grandir au centre (comme le logo), puis l'écran se referme sur elle et dévoile l'assistant
  let enCours = false;
  bulle.onclick = () => {
    if(enCours) return;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches || !MOTION){ aller('ia'); return; }
    enCours = true;
    const A = MOTION.animate, EASE = [.65,0,.35,1];
    const r = bulle.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    const W = window.innerWidth, H = window.innerHeight, mx = W/2, my = H*.46;
    const couvre = (x,y) => Math.ceil(Math.hypot(Math.max(x, W-x), Math.max(y, H-y))) + 4;
    const voile = document.createElement('div');
    voile.className = 'voile-ia';
    voile.innerHTML = `<span class="vi-logo" style="left:${cx - r.width/2}px;top:${cy - r.height/2}px"><span class="vi-halo"></span><span class="vi-halo"></span>${bulle.querySelector('svg').outerHTML}</span>`;
    voile.style.clipPath = `circle(${r.width/2}px at ${cx}px ${cy}px)`;
    document.body.appendChild(voile);
    bulle.classList.add('partie');
    const logo = voile.querySelector('.vi-logo');
    const fin = () => { voile.remove(); bulle.classList.remove('partie'); enCours = false; };
    // 1. le violet envahit l'écran, la bulle file au centre en grandissant
    A(voile, {clipPath:[`circle(${r.width/2}px at ${cx}px ${cy}px)`, `circle(${couvre(cx,cy)}px at ${cx}px ${cy}px)`]}, {duration:.55, ease:EASE});
    A(logo, {x:[0, mx-cx], y:[0, my-cy]}, {duration:.6, ease:EASE});
    A(logo, {scale:[1, 2]}, {type:'spring', bounce:.35, visualDuration:.6});
    voile.querySelectorAll('.vi-halo').forEach((h,k)=>A(h, {scale:[.9,1,1.9], opacity:[0,0,.7,0]}, {duration:1.1+k*.2, ease:'easeOut', delay:.25, scale:{duration:1.1+k*.2, times:[0,.15+k*.1,1], ease:[.16,1,.3,1]}, opacity:{duration:1.1+k*.2, times:[0,.12+k*.1,.25+k*.1,1]}}));
    // 2. l'assistant prend la place de l'écran, puis le violet se referme sur la bulle
    setTimeout(() => {
      aller('ia');
      A(logo, {scale:[2, 2.15, 0]}, {duration:.7, ease:EASE, times:[0,.35,1]});
      A(voile, {clipPath:[`circle(${couvre(mx,my)}px at ${mx}px ${my}px)`, `circle(0px at ${mx}px ${my}px)`]}, {duration:.7, ease:EASE})
        .finished.then(fin, fin);
      const elements = [...document.querySelectorAll('#app .vue > *')].slice(0, 8);
      if(elements.length) A(elements, {opacity:[0,1], y:[22,0]}, {duration:.7, delay:MOTION.stagger(.07,{startDelay:.3}), ease:[.22,1,.36,1]});
      const saisie = document.querySelector('#app .saisie');
      if(saisie) A(saisie, {opacity:[0,1], y:[40,0]}, {duration:.7, delay:.45, ease:[.22,1,.36,1]});
    }, 820);
    setTimeout(() => { if(enCours){ if(vue !== 'ia') aller('ia'); fin(); } }, 3000);   // filet de sécurité
  };
  const racine = document.documentElement;
  let prevu = 0;
  const placer = () => {
    prevu = 0;
    const haut = onglets.getBoundingClientRect().top;
    let extra = 0;
    document.querySelectorAll('#app .barre-action, #app .panier, #app .saisie').forEach(b => {
      if(!b.getClientRects().length) return;
      const r = (b.firstElementChild || b).getBoundingClientRect();
      if(r.height) extra = Math.max(extra, haut - r.top);
    });
    racine.style.setProperty('--bulle-bas', Math.round(onglets.offsetHeight + extra + 12) + 'px');
    document.body.classList.toggle('panier-ouvert', !!document.querySelector('#app .panier-corps'));
  };
  const planifier = () => { if(!prevu) prevu = requestAnimationFrame(placer); };
  new MutationObserver(planifier).observe(document.getElementById('app'), {childList:true, subtree:true});
  window.addEventListener('resize', planifier);
  // pendant la saisie (clavier ouvert), la bulle s'efface
  const champ = el => !!el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
  document.addEventListener('focusin', e => document.body.classList.toggle('en-saisie', champ(e.target)));
  document.addEventListener('focusout', () => setTimeout(() => document.body.classList.toggle('en-saisie', champ(document.activeElement)), 50));
  planifier();
})();
</script>
<script>
/* iOS 26 (bug WebKit) : quand le clavier se ferme, visualViewport.offsetTop ne revient pas à 0.
   Les éléments fixes restent calés sur l'ancienne zone et remontent avec le défilement.
   On mesure l'écart entre le bas de la zone visible et le bas de la page, et on redescend
   les barres d'autant (variable --derive). Jamais pendant la saisie, jamais vers le haut. */
(function(){
  const vv = window.visualViewport; if(!vv) return;
  const racine = document.documentElement;
  let derive = 0, prevu = 0, attente = 0, bouge = 0, doigt = false;
  const saisie = () => { const a = document.activeElement; return !!a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable); };
  // rebond élastique en haut ou en bas de page : ce n'est pas le bug, on ne touche à rien
  const rebond = () => { const max = Math.max(0, racine.scrollHeight - racine.clientHeight); return window.scrollY < -1 || window.scrollY > max + 1; };
  const ecart = () => { if(saisie() || rebond()) return 0; const d = Math.round(vv.offsetTop + vv.height - racine.clientHeight); return d >= 2 && d <= 700 ? d : 0; };
  const poser = d => { if(d !== derive){ derive = d; racine.style.setProperty('--derive', d + 'px'); } };
  const mesurer = () => {
    prevu = 0;
    const d = ecart();
    if(d <= derive){ clearTimeout(attente); poser(d); return; }   // l'écart se résorbe : tout de suite
    // l'écart apparaît : on ne corrige que s'il est encore là une fois l'écran immobile (doigt levé, défilement fini)
    clearTimeout(attente);
    attente = setTimeout(() => { if(doigt || Date.now() - bouge < 250){ planifier(); return; } const d2 = ecart(); if(d2 > derive) poser(d2); }, 300);
  };
  const planifier = () => { if(!prevu) prevu = requestAnimationFrame(mesurer); };
  const mouvement = () => { bouge = Date.now(); planifier(); };
  vv.addEventListener('resize', planifier);
  vv.addEventListener('scroll', mouvement);
  window.addEventListener('scroll', mouvement, {passive:true});
  window.addEventListener('resize', planifier);
  window.addEventListener('pageshow', planifier);
  document.addEventListener('visibilitychange', planifier);
  document.addEventListener('focusin', planifier);
  document.addEventListener('focusout', () => { planifier(); setTimeout(planifier, 350); setTimeout(planifier, 900); });
  document.addEventListener('touchstart', () => { doigt = true; }, {passive:true});
  document.addEventListener('touchend', () => { doigt = false; bouge = Date.now(); setTimeout(planifier, 60); }, {passive:true});
  document.addEventListener('touchcancel', () => { doigt = false; }, {passive:true});
  planifier();
})();
</script>
