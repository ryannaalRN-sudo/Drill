<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#20BDA1" id="couleurBarre">
<title>Drill</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drill">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --email:#F5F8F8;      /* fond : émail */
  --carte:#FFFFFF;
  --encre:#0F2A33;      /* texte */
  --encre-2:#4A6470;
  --trait:#DCE6E8;
  --lagon:#0E9384;      /* action principale */
  --lagon-pale:#E1F4F1;
  --gencive:#E8546B;    /* alertes fortes */
  --gencive-pale:#FDECEF;
  --ambre:#C77A0A;
  --ambre-pale:#FDF3E2;
  --ia:#5B4FD9;         /* tout ce qui touche à l'IA */
  --ia-pale:#EEECFC;
  --r-l:22px; --r-m:14px; --r-s:10px;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --texte:"Atkinson Hyperlegible", system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--email);color:var(--encre);font-family:var(--texte);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
em,i{font-style:normal}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lagon);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;min-height:100dvh;padding:0 18px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;line-height:1.1}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
.sous{color:var(--encre-2)}
.demo{margin:14px 0 0;padding:10px 14px;border-radius:var(--r-s);background:var(--ambre-pale);color:#7A4A05;font-size:.85rem}

/* ---------- en-tête ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 6px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.25rem}
.logo svg{width:30px;height:30px}
.retour{display:inline-flex;align-items:center;gap:6px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--carte);border:1px solid var(--trait);font-weight:700;font-size:.9rem}

/* ---------- accueil ---------- */
.accroche{padding:22px 0 18px}
.accroche h1{max-width:13ch}
.outils{display:grid;gap:12px}
.outil{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;text-align:left;background:var(--carte);border:1px solid var(--trait);border-radius:var(--r-l);padding:18px}
.outil:active{transform:scale(.985)}
.outil .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.outil .ico svg{width:28px;height:28px}
.outil h3{margin-bottom:2px}
.outil p{font-size:.9rem;color:var(--encre-2)}
.outil .fl{color:var(--encre-2)}
.ico.l{background:var(--lagon-pale);color:var(--lagon)}
.ico.i{background:var(--ia-pale);color:var(--ia)}
.ico.g{background:var(--gencive-pale);color:var(--gencive)}
.ico.a{background:var(--ambre-pale);color:var(--ambre)}
.bientot{opacity:.55}
.pastille{font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--trait);color:var(--encre-2)}
.bloc-titre{margin:26px 0 10px;font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--encre-2)}

/* ---------- Prescri'Dent : progression du questionnaire ---------- */
.progression{position:relative;margin:18px 6px 8px}
.prog-rail{position:absolute;left:15px;right:15px;top:13px;height:4px;border-radius:2px;background:var(--trait);overflow:hidden}
.prog-plein{position:absolute;inset:0;border-radius:2px;background:var(--lagon);transform-origin:0 50%}
.prog-etapes{position:relative;display:flex;justify-content:space-between;list-style:none;margin:0;padding:0}
.prog-etapes li{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--carte);border:2px solid var(--trait);font-family:var(--display);font-weight:800;font-size:.82rem;color:var(--encre-2)}
.prog-etapes li.fait{background:var(--lagon);border-color:var(--lagon);color:#fff}
.prog-etapes li svg{width:16px;height:16px}
.prog-etapes li.cours{border-color:var(--lagon);color:var(--lagon);box-shadow:0 0 0 5px var(--lagon-pale)}
.etape-n{text-align:center;font-size:.85rem;color:var(--encre-2)}
.question{padding:18px 0 110px}
.question h2{margin-bottom:6px}
.choix{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px;border-radius:var(--r-m);background:var(--carte);border:1.5px solid var(--trait);transition:border-color .15s, background .15s}
.opt .coche{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--trait);display:grid;place-items:center;transition:.15s}
.opt.multi .coche{border-radius:7px}
.opt[aria-pressed="true"]{border-color:var(--lagon);background:var(--lagon-pale)}
.opt[aria-pressed="true"] .coche{background:var(--lagon);border-color:var(--lagon)}
.opt[aria-pressed="true"] .coche::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.opt b{display:block}
.opt small{color:var(--encre-2);font-size:.85rem;display:block;line-height:1.35}
.champ{display:grid;gap:6px;margin-top:14px}
.champ label{font-weight:700;font-size:.9rem}
.champ input{padding:14px;border-radius:var(--r-s);border:1.5px solid var(--trait);background:var(--carte);width:100%}
.champ input:focus{border-color:var(--lagon);outline:none}
.barre-action{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));padding:12px 18px;background:linear-gradient(transparent,var(--email) 30%)}
.barre-action .in{max-width:524px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;padding:16px;border-radius:999px;font-weight:700;text-align:center;background:var(--lagon);color:#fff}
.btn:disabled{opacity:.35}
.btn.sec{background:var(--carte);color:var(--encre);border:1.5px solid var(--trait);flex:0 0 auto;padding:16px 20px}
.btn.ia{background:var(--ia)}

/* ---------- résultat ---------- */
.alerte{display:flex;gap:12px;padding:14px;border-radius:var(--r-m);margin-top:10px;font-size:.93rem}
.alerte svg{flex:none;width:22px;height:22px;margin-top:1px}
.alerte.forte{background:var(--gencive-pale);color:#8E1F31}
.alerte.moy{background:var(--ambre-pale);color:#7A4A05}
.alerte.info{background:var(--lagon-pale);color:#065E54}
.alerte b{display:block}
.lignes{margin-top:10px;display:grid;gap:10px}
.ligne{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px;border-radius:var(--r-m);background:var(--carte);border:1.5px solid var(--trait)}
.ligne[aria-pressed="false"]{opacity:.45}
.ligne .med{font-weight:700;color:#0A7A5C}
.ligne .pos{font-size:.9rem;color:var(--encre-2)}
.ligne .coche{width:24px;height:24px;border-radius:7px;border:2px solid var(--trait);display:grid;place-items:center}
.ligne[aria-pressed="true"] .coche{background:var(--lagon);border-color:var(--lagon)}
.ligne[aria-pressed="true"] .coche::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.vidal{font-size:.8rem;font-weight:700;color:var(--lagon);text-decoration:none;margin-top:4px;display:inline-block}
.patient{margin-top:22px;padding:18px;border-radius:var(--r-l);background:var(--carte);border:1px solid var(--trait)}
.patient p{font-size:.85rem;color:var(--encre-2);margin-top:4px}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- codage ---------- */
.recherche{position:relative;margin:16px 0 4px}
.recherche input{width:100%;padding:15px 16px 15px 46px;border-radius:999px;border:1.5px solid var(--trait);background:var(--carte)}
.recherche input:focus{border-color:var(--lagon);outline:none}
.recherche svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--encre-2)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:9px 16px;border-radius:999px;border:1.5px solid var(--trait);background:var(--carte);font-weight:700;font-size:.9rem}
.cat[aria-pressed="true"]{background:var(--encre);color:#fff;border-color:var(--encre)}
.acte{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px 16px;border-radius:var(--r-m);background:var(--carte);border:1.5px solid var(--trait);margin-top:10px;text-align:left;width:100%}
.acte .code{font-family:var(--display);font-weight:700;letter-spacing:.02em;color:var(--lagon)}
.acte .lib{font-size:.92rem}
.acte .plus{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--lagon-pale);color:var(--lagon);font-size:1.4rem;font-weight:700}
.acte.dans .plus{background:var(--lagon);color:#fff}
.compteur{padding:18px;border-radius:var(--r-l);background:var(--carte);border:1.5px solid var(--trait);margin-top:12px}
.compteur .rangee{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--email);border:1.5px solid var(--trait);font-size:1.3rem;font-weight:700}
.stepper output{min-width:52px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.8rem}
.stepper .nb{width:68px;height:48px;padding:0;text-align:center;font-family:var(--display);font-weight:800;font-size:1.7rem;color:var(--encre);background:var(--email);border:1.5px solid var(--trait);border-radius:14px;-moz-appearance:textfield;appearance:textfield}
.stepper .nb:focus{outline:none;border-color:var(--lagon);background:var(--carte)}
.stepper .nb::-webkit-inner-spin-button,.stepper .nb::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.seg.trois button{font-size:.8rem;line-height:1.2;padding:9px 4px}
.seg.quatre button{font-size:.84rem;padding:10px 2px}
.vue.calme{animation:none}
.qte{display:flex;align-items:center;gap:4px;flex:none;background:var(--lagon);border-radius:999px;padding:3px}
.qte button{width:32px;height:32px;border-radius:50%;color:#fff;font-size:1.25rem;font-weight:700;line-height:1;display:grid;place-items:center}
.qte button:active{background:rgba(255,255,255,.2)}
.qte b{min-width:22px;text-align:center;color:#fff;font-family:var(--display);font-weight:800;font-size:1.05rem}
.p-acte .qte{background:rgba(255,255,255,.12);padding:2px}
.p-acte .qte button{width:28px;height:28px;font-size:1.1rem;color:#fff}
.fois{font-family:var(--display);font-weight:800;color:#7FE3D3;margin-left:4px}
.panier-haut{display:flex;align-items:center;gap:10px}
.panier-haut .panier-tete{flex:1;min-width:0}
.fermer-p{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.fermer-p svg{width:16px;height:16px}
.compteur .limite{margin-top:6px;font-size:.78rem;color:var(--encre-2);text-align:right}
.seg{display:flex;background:var(--email);border-radius:999px;padding:4px;margin-top:10px}
.seg button{flex:1;padding:10px 6px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--encre-2)}
.seg button[aria-pressed="true"]{background:var(--carte);color:var(--encre);box-shadow:0 1px 3px rgba(15,42,51,.12)}
.resultat-code{margin-top:14px;padding:12px 14px;border-radius:var(--r-s);background:var(--lagon-pale);display:flex;justify-content:space-between;align-items:center;gap:10px}
.resultat-code .code{font-family:var(--display);font-weight:800;font-size:1.2rem;color:#065E54}
.resultat-code small{display:block;font-size:.82rem;color:#065E54}
.mini{padding:10px 14px;border-radius:999px;background:var(--lagon);color:#fff;font-weight:700;font-size:.85rem;flex:none}

.acte .prix{margin-left:8px;font-weight:700;font-size:.85rem;color:var(--encre-2)}
.resultat-code .prix.fort{font-family:var(--display);font-weight:700;color:#065E54;margin-left:6px}
.p-droite{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;text-align:right}
.p-droite small{color:#9FB6BD;font-size:.75rem}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15)}
.total small{display:block;color:#9FB6BD;font-size:.78rem}
.total b{font-family:var(--display);font-size:1.6rem;font-weight:800;color:#7FE3D3}
.total-tete{font-family:var(--display);font-weight:800;font-size:1.1rem;color:#7FE3D3}
.mcode{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:7px;background:#7FE3D3;color:var(--encre);font-family:var(--display);font-weight:800;font-size:.85rem;vertical-align:1px}
.mcode.grand{min-width:34px;height:34px;font-size:1.05rem;border-radius:10px;flex:none}
.mod{gap:12px}
.ddn-c{display:grid;gap:6px;padding:4px 2px 10px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:4px}
.ddn-c label{font-weight:700;font-size:.9rem}
.ddn-c input{padding:12px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:16px;color-scheme:dark}
.ddn-c small{color:#9FB6BD;font-size:.8rem;line-height:1.35}
.deux-btn{display:flex;gap:8px}
.deux-btn .copier{width:auto;flex:1}
.deux-btn .copier.sec{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3);flex:0 0 auto;padding:13px 18px}
.bulle p+p{margin-top:8px}
.bulle ul.rx{margin:6px 0 4px 18px;display:grid;gap:4px}
.bulle .btn.sec{display:block;padding:12px}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
.paysage{display:none}
@media (orientation:landscape) and (max-height:520px){
  .paysage{display:flex;position:fixed;inset:0;z-index:50;background:var(--email);flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-family:var(--display);font-weight:700;font-size:1.2rem}
  .paysage svg{width:48px;height:48px;color:var(--lagon)}
}
.groupe{margin:16px 2px 2px;font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--encre-2)}
.choix .groupe:first-child{margin-top:4px}
/* Rubriques encadrées */
.rubrique{margin-top:16px;padding:16px;border-radius:var(--r-l);background:var(--carte);border:1.5px solid var(--trait);box-shadow:0 1px 3px rgba(15,42,51,.05)}
.rubrique:first-child{margin-top:4px}
.rubrique-t{padding-bottom:12px;margin-bottom:2px;border-bottom:1.5px solid var(--trait)}
.rubrique-t h2{font-size:1.35rem;margin:0}
.rubrique-t .sous{font-size:.86rem;margin-bottom:2px}
.rubrique > .sous{margin-top:10px}
.rubrique .verdict{background:var(--email);border:0;border-left:4px solid #8E1F31;border-radius:var(--r-s)}
.rubrique .verdict.non{border-left-color:var(--lagon)}
.rubrique .ajout-med-zone{background:var(--email)}
.rubrique .bloc-titre:first-child{margin-top:0}
/* Alertes regroupées : un bloc rouge, un bloc orange, un bloc vert */
.ga{margin-top:12px;border-radius:var(--r-m);border:1.5px solid;overflow:hidden}
.ga.forte{background:var(--gencive-pale);border-color:#F4C3CC;color:#8E1F31}
.ga.moy{background:var(--ambre-pale);border-color:#F0D3A2;color:#7A4A05}
.ga.info{background:var(--lagon-pale);border-color:#B3E0D8;color:#065E54}
.ga-t{display:flex;align-items:center;gap:8px;padding:11px 14px;font-family:var(--display);font-weight:800;font-size:1rem;background:rgba(255,255,255,.45);border-bottom:1.5px solid;border-color:inherit}
.ga-t svg{flex:none;width:20px;height:20px}
.ga-nb{margin-left:auto;min-width:24px;height:24px;padding:0 7px;border-radius:999px;display:grid;place-items:center;font-size:.8rem;background:rgba(255,255,255,.8)}
.ga-i{padding:12px 14px;font-size:.93rem;line-height:1.45}
.ga-i + .ga-i{border-top:1px solid rgba(15,42,51,.09)}
.ga-i b{display:block}
.ga-i.geste{display:flex;gap:10px;align-items:flex-start}
.ga-i.geste svg{flex:none;width:17px;height:17px;margin-top:3px}
.ga-corps{padding:10px;margin:0}
.ga-corps .pr{border-color:rgba(15,42,51,.1)}
.pr-cl{display:block;font-family:var(--texte);font-weight:400;font-size:.76rem;color:var(--encre-2);margin-top:1px}
.verdict{margin-top:14px;padding:16px;border-radius:var(--r-m);border:1.5px solid var(--trait);background:var(--carte)}
.verdict b{display:block;font-family:var(--display);font-size:1.15rem;margin-bottom:4px}
.verdict.oui b{color:#8E1F31}.verdict.non b{color:#065E54}
.verdict p{font-size:.93rem;margin-top:6px}
.gestes{margin:12px 0 0 0;padding:0;list-style:none;display:grid;gap:8px}
.gestes li{padding:12px 14px;border-radius:var(--r-m);background:var(--lagon-pale);color:#065E54;font-size:.93rem}
.src{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;background:rgba(15,42,51,.08);color:var(--encre-2);font-size:.72rem;font-weight:700;white-space:nowrap;vertical-align:1px}
.date-saisie{font-size:16px;letter-spacing:.04em}
.patient .champ input{width:100%;min-width:0}
.opt{transition:border-color .15s, background .15s, transform .12s}
.opt:active{transform:scale(.985)}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(70% 40% at 25% 30%,rgba(127,245,221,.28),transparent 70%),linear-gradient(180deg,#20BDA1 0%,#0E9384 45%,#0A3556 100%);transition:opacity .45s ease, visibility .45s}
#splash .logo-l{position:relative;width:112px;height:112px}
#splash img{position:relative;width:112px;height:112px;border-radius:26px;box-shadow:0 18px 40px rgba(4,36,58,.45)}
#splash .halo{position:absolute;inset:-6px;border-radius:32px;border:3px solid rgba(255,255,255,.75);opacity:0}
#splash .mot{display:flex;overflow:hidden;padding:2px 4px 6px;font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:.02em;color:#fff}
#splash .mot i{display:inline-block;font-style:normal}
#splash.sans-motion img{animation:splashLogo .7s cubic-bezier(.2,1.3,.4,1) both}
#splash.sans-motion .mot{animation:splashTxt .6s .25s ease-out both}
#splash.fini{opacity:0;visibility:hidden;transition:opacity .45s ease, visibility .45s}
@keyframes splashLogo{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes splashTxt{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* panier */
.panier{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));padding:0 12px 10px}
.panier .in{max-width:536px;margin:0 auto;background:var(--encre);color:#fff;border-radius:var(--r-l);padding:14px 16px;box-shadow:0 10px 30px rgba(15,42,51,.25)}
.panier-tete{display:flex;justify-content:space-between;align-items:center;width:100%;color:#fff}
.panier-tete b{font-family:var(--display);font-size:1.05rem}
.badge{background:var(--lagon);border-radius:999px;padding:2px 10px;font-weight:700;margin-left:6px}
.panier-corps{margin-top:12px;display:grid;gap:8px;max-height:52dvh;overflow:auto}
.p-acte{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-s);background:rgba(255,255,255,.07);font-size:.9rem}
.p-acte .code{font-family:var(--display);font-weight:700}
.p-acte .mods{color:#7FE3D3;font-weight:700}
.p-acte button{color:#9FB6BD;font-size:1.2rem;line-height:1}
.mod{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px}
.mod small{display:block;color:#9FB6BD;font-size:.8rem;line-height:1.3}
.switch{flex:none;width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:.2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s cubic-bezier(.3,1.4,.5,1)}
.switch[aria-checked="true"]{background:var(--lagon)}
.switch[aria-checked="true"]::after{left:25px}
.mod-titre{font-size:.8rem;color:#9FB6BD;margin-top:8px}
.copier{width:100%;margin-top:10px;padding:13px;border-radius:999px;background:#fff;color:var(--encre);font-weight:700}

/* ---------- assistant ---------- */
.fil{display:grid;gap:12px;margin-top:16px}
.bulle{padding:14px 16px;border-radius:var(--r-m);max-width:92%;font-size:.95rem}
.affine{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:.82rem;color:var(--ia)}
.affine i{width:5px;height:5px;border-radius:50%;background:var(--ia);animation:affine 1s ease-in-out infinite}
.affine i:nth-child(2){animation-delay:.15s}.affine i:nth-child(3){animation-delay:.3s;margin-right:6px}
@keyframes affine{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-3px)}}
.bulle.moi{justify-self:end;background:var(--encre);color:#fff;border-bottom-right-radius:4px}
.bulle.lui{background:var(--carte);border:1px solid var(--trait);border-bottom-left-radius:4px}
.bulle.lui.ia{border-color:#D6D2F7}
.bulle .code{font-family:var(--display);font-weight:800;color:var(--lagon)}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sugg{padding:9px 14px;border-radius:999px;background:var(--ia-pale);color:var(--ia);font-weight:700;font-size:.85rem;text-align:left}
.saisie{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));padding:10px 18px 12px;background:linear-gradient(transparent,var(--email) 25%)}
.saisie form{max-width:524px;margin:0 auto;display:flex;gap:8px}
.saisie input{flex:1;padding:15px 18px;border-radius:999px;border:1.5px solid #D6D2F7;background:var(--carte)}
.saisie input:focus{border-color:var(--ia);outline:none}
.saisie button{width:52px;height:52px;border-radius:50%;background:var(--ia);color:#fff;display:grid;place-items:center}

/* ---------- barre d'onglets ---------- */
.onglets{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--trait);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
.onglets .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.indic{position:absolute;left:0;top:2px;width:20%;height:32px;display:flex;justify-content:center;pointer-events:none;transition:opacity .2s}
.indic i{width:56px;height:32px;border-radius:999px;background:var(--lagon-pale);transition:background .2s}
.indic.ia i{background:var(--ia-pale)}
.onglet{position:relative;z-index:1;display:grid;justify-items:center;gap:3px;padding:6px 0;font-size:.72rem;font-weight:700;color:var(--encre-2);letter-spacing:-.01em;min-width:0}
.onglet svg{width:24px;height:24px}
.onglet[aria-current="page"]{color:var(--lagon)}
.onglet.ia[aria-current="page"]{color:var(--ia)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,calc(-100% - 60px));background:var(--encre);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:.9rem;transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:20}
.toast:not(.vu){visibility:hidden;transition:transform .35s cubic-bezier(.3,1.4,.5,1),visibility 0s .35s}
.toast.vu{transform:translate(-50%,0)}
.vue{animation:entree .28s ease-out}
@keyframes entree{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- ordonnance (impression) ---------- */
#ordo{display:none}
@media print{
  @page{size:A4;margin:16mm}
  body{background:#fff}
  .app,.onglets,.barre-action,.panier,.saisie,.toast,.guide,.bulle-ia{display:none!important}
  #ordo{display:block;font-family:var(--texte);color:#000;font-size:11.5pt}
  #ordo .entete{display:flex;justify-content:space-between;border-bottom:1.5pt solid #000;padding-bottom:8mm}
  #ordo .bloc-patient{margin:10mm 0 8mm}
  #ordo .med{font-weight:700;margin-top:6mm}
  #ordo .signature{margin-top:24mm;margin-left:55%;border-top:.5pt solid #999;padding-top:2mm;font-size:9pt;color:#555}
}
/* ---------- scanner ---------- */

.zone-photo{position:relative;margin-top:14px;border-radius:var(--r-m);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#000}

.poignee[data-c="nw"]{left:-15px;top:-15px}.poignee[data-c="ne"]{right:-15px;top:-15px}
.poignee[data-c="sw"]{left:-15px;bottom:-15px}.poignee[data-c="se"]{right:-15px;bottom:-15px}
.roue{display:inline-block;width:16px;height:16px;margin-right:8px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-3px;animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.med-liste{display:grid;gap:10px;margin-top:14px}
.med-ligne{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 12px 14px;border-radius:var(--r-m);background:var(--carte);border:1.5px solid var(--trait)}

.med-ligne small{display:block;font-size:.82rem;line-height:1.35;margin-top:2px}
.med-ligne small.ok{color:#065E54}.med-ligne small.ko{color:#8E1F31}
.suppr{flex:none;width:32px;height:32px;border-radius:50%;background:var(--email);color:var(--encre-2);font-size:1.2rem;font-weight:700}
.ajout-med{display:flex;gap:8px;align-items:flex-end;margin-top:12px;padding:8px 8px 8px 14px;border-radius:var(--r-m);border:1.5px dashed var(--trait);background:var(--carte)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{padding:5px 11px;border-radius:999px;background:var(--lagon-pale);color:#065E54;font-weight:700;font-size:.82rem}
.chip.ko{background:var(--gencive-pale);color:#8E1F31}
.presc{display:grid;gap:8px;margin-top:6px}
.pr{border-radius:var(--r-m);background:var(--carte);border:1.5px solid var(--trait)}
.pr>summary,div.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;font-weight:700;font-size:.93rem;list-style:none;cursor:pointer}
.pr>summary::-webkit-details-marker{display:none}
.pr.ci,.pr.asdec{border-color:#F4B6C1}.pr.pe{border-color:#F0D29E}

.pr li{padding-top:8px;border-top:1px solid var(--trait)}

.niv.apec{background:#E8EEF0;color:var(--encre-2)}

.niv.ci{background:var(--gencive);color:#fff}
.bouche li{background:var(--carte);border:1px solid var(--trait);color:var(--encre)}
.bouche li b{display:block}
.ia-bulle{background:var(--ia-pale);max-width:100%}
.lien-scan{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 14px;border-radius:999px;background:var(--lagon-pale);color:#065E54;font-weight:700;font-size:.88rem}

.mm-c>summary,div.mm-c{align-items:flex-start}
.mm{display:grid;gap:2px;min-width:0}
.mm small{font-weight:400;color:var(--encre-2);font-size:.84rem;line-height:1.35}
.rcp{display:block;font-weight:400;white-space:pre-line;margin-top:2px}
.ordo-texte{margin-top:10px;padding:18px;border-radius:var(--r-m);background:#fff;border:1.5px dashed var(--lagon);font-size:.95rem;line-height:1.45;-webkit-user-select:text;user-select:text;display:grid;gap:16px}
.ordo-texte .ol b{display:block}
.ordo-texte .ol span{display:block;color:var(--encre-2)}
.q-rech{margin:14px 0 2px}
.epingle .opt{border-style:dashed}
/* précisions qui s'ouvrent sous une option cochée */
.precis{margin:-4px 0 4px 16px;padding:10px 0 6px 14px;border-left:2px solid var(--lagon-pale);display:grid;gap:14px}
.precis[hidden]{display:none}
.bloc-t{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 7px;font-family:var(--display);font-weight:700;font-size:.84rem;color:var(--encre-2)}
.bloc-t .requis{font-family:var(--texte);font-size:.72rem;font-weight:700;color:var(--ambre);background:var(--ambre-pale);border-radius:999px;padding:2px 9px}
.bloc-t .requis[hidden]{display:none}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puce{display:inline-flex;flex-direction:column;align-items:flex-start;text-align:left;max-width:100%;padding:8px 13px;border-radius:14px;background:var(--carte);border:1.5px solid var(--trait);font-size:.9rem;line-height:1.25;transition:border-color .15s, background .15s}
.puce b{font-weight:700}
.puce small{color:var(--encre-2);font-size:.76rem;margin-top:2px}
.puce[aria-pressed="true"]{border-color:var(--lagon);background:var(--lagon-pale)}
.puce[aria-pressed="true"] b::before{content:"✓\00a0";color:var(--lagon)}
.bloc.grand .puces{display:grid}
.bloc.grand .puce{width:100%;padding:11px 14px}
.bloc.attire .requis{animation:attire .5s ease 2}
@keyframes attire{50%{transform:scale(1.12)}}
.btn.a-preciser{background:var(--ambre)}
.choix .grp{display:grid;gap:10px}
.choix .grp[hidden],.opt[hidden]{display:none}
.ajout-med-zone{margin-top:16px;padding:14px;border-radius:var(--r-m);border:1.5px dashed var(--trait);background:var(--carte)}
.sugg-liste{display:grid;gap:6px;margin-top:8px}
.sugg-liste:empty{display:none}
.sug{display:grid;text-align:left;padding:10px 12px;border-radius:var(--r-s);background:var(--email);border:1px solid var(--trait)}
.sug small{color:var(--encre-2);font-size:.82rem}
.ajout-carte{margin-top:12px;display:grid;gap:4px}
.ajout-nom{font-family:var(--display);font-size:1.15rem}
.ajout-carte .champ input{font-size:16px}
.ligne.ajoutee{border-color:#F0D29E}
.ligne.ajoutee .coche{cursor:pointer}
.mini-alerte{display:block;margin-top:6px;padding:6px 9px;border-radius:8px;font-size:.84rem}
.mini-alerte.forte{background:var(--gencive-pale);color:#8E1F31}.mini-alerte.moy{background:var(--ambre-pale);color:#7A4A05}.mini-alerte.info{background:var(--lagon-pale);color:#065E54}
.retirer{background:none;border:0;padding:0;margin-top:6px;color:var(--gencive)}
.pres{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.chip-pres{padding:6px 10px;border-radius:999px;border:1.5px solid var(--trait);background:var(--email);font-size:.84rem;font-weight:700;color:var(--encre-2)}
.chip-pres[aria-pressed="true"]{background:var(--lagon-pale);border-color:var(--lagon);color:#065E54}
/* Médicodex */
.mx-res{display:grid;gap:10px;margin-top:12px}
.mx-carte{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 16px;border-radius:var(--r-m);background:var(--carte);border:1.5px solid var(--trait)}
.mx-carte b{display:block;font-family:var(--display);font-size:1.05rem}
.mx-carte small{display:block;color:var(--encre-2);font-size:.84rem;margin-top:2px}
.mx-carte svg{flex:none;width:18px;height:18px;color:var(--encre-2)}
.mx-sugg{display:flex;flex-wrap:wrap;gap:8px}

.mx-tete h2{font-size:1.7rem}
.mx-compte{font-size:.86rem;margin-top:2px}

.mx-vidal b{grid-column:2;grid-row:1}
.mx-vidal small{grid-column:1;font-weight:400;font-size:.76rem;color:var(--encre-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mx-kg{display:flex;align-items:center;gap:8px}
.mx-kg input{width:84px;height:48px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--encre);background:var(--email);border:1.5px solid var(--trait);border-radius:14px}
.mx-kg input:focus{outline:none;border-color:var(--lagon);background:var(--carte)}
.mx-kg span{font-weight:700;color:var(--encre-2)}
.mx-schemas{display:grid;gap:10px;margin-top:14px}
.mx-schema{display:grid;gap:6px;padding:14px 14px 12px;border-radius:var(--r-s);background:var(--lagon-pale);border:1.5px solid #C4E8E1;border-left:5px solid var(--lagon)}
.mx-schema .src{background:rgba(255,255,255,.75)}

.mx-st .src{flex:none;margin:2px 0 0}
.mx-dose{font-size:.98rem;line-height:1.4;color:var(--encre)}
.mx-schema small{font-size:.8rem;color:var(--encre-2)}

.mx-rcp p{margin:6px 0}
.mx-rcp b{font-weight:700;color:var(--encre)}

.pr .mx-rcp ul.mx-l{display:block;list-style:disc;padding:0 0 0 20px;margin:4px 0;font-size:inherit}

.mx-cas{margin:8px 0;padding:8px 12px;border-radius:10px;background:var(--email);border-left:3px solid var(--lagon)}
.mx-cas-t{display:block;font-weight:700;color:#065E54;line-height:1.35}
.mx-cas p{margin:3px 0}
.mx-formes .chip-pres{text-align:left}
.mx-rub{margin-top:8px}

.roue.sombre{border-color:var(--trait);border-top-color:var(--lagon)}
/* iOS 26 : après la fermeture du clavier, la zone visible reste décalée (visualViewport.offsetTop ≠ 0)
   et les barres fixes « flottent ». --derive, mesuré en JS, les ramène au bas de l'écran. */
:root{--derive:0px}
/* Assistant : même bouton que la flèche « envoyer » (rond violet plein), avec un reflet de verre */
.bulle-ia{position:fixed;right:16px;bottom:calc(var(--bulle-bas,96px) - var(--derive));z-index:6;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;overflow:hidden;
  background:var(--ia);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.18),inset 0 -5px 9px rgba(40,28,150,.18),0 4px 12px rgba(91,79,217,.26);
  transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .2s,bottom .25s ease,visibility 0s}
.bulle-ia::before{content:"";position:absolute;left:7px;right:7px;top:3px;height:48%;border-radius:999px 999px 60% 60%/999px 999px 40% 40%;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.05) 80%,rgba(255,255,255,0));pointer-events:none}
.bulle-ia::after{content:"";position:absolute;right:9px;bottom:7px;width:12px;height:6px;border-radius:50%;background:rgba(255,255,255,.16);filter:blur(1.5px);transform:rotate(-35deg);pointer-events:none}
.bulle-ia svg{position:relative;z-index:1;width:24px;height:24px}
.bulle-ia:active{transform:scale(.9)}
.bulle-ia.partie{opacity:0!important;transition:none!important}
.voile-ia{position:fixed;inset:0;z-index:40;pointer-events:auto;will-change:clip-path;
  background:radial-gradient(70% 40% at 25% 30%,rgba(201,195,255,.35),transparent 70%),linear-gradient(180deg,#7A6FF0 0%,#5B4FD9 50%,#3D3499 100%)}
.vi-logo{position:absolute;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ia);will-change:transform;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.2),inset 0 -5px 9px rgba(40,28,150,.2),0 10px 24px rgba(20,14,80,.35)}
.vi-logo::before{content:"";position:absolute;left:7px;right:7px;top:3px;height:48%;border-radius:999px 999px 60% 60%/999px 999px 40% 40%;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.05) 80%,rgba(255,255,255,0))}
.vi-logo svg{position:relative;width:24px;height:24px}
.vi-halo{position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(255,255,255,.75);opacity:0}
body[data-vue="prescri"] .bulle-ia,body[data-vue="ia"] .bulle-ia,body.en-saisie .bulle-ia,body.panier-ouvert .bulle-ia,body:not([data-vue]) .bulle-ia{opacity:0;transform:scale(.5);pointer-events:none;visibility:hidden;transition:transform .25s ease,opacity .2s,visibility 0s .25s}
.onglets{bottom:calc(0px - var(--derive))}
.barre-action,.panier,.saisie{bottom:calc(72px + env(safe-area-inset-bottom) - var(--derive))}
body .guide{top:var(--derive);bottom:calc(0px - var(--derive))}
.poso-sugg{display:grid;gap:6px}
.sug.choisie{border-color:var(--lagon);background:var(--lagon-pale)}
.favs{margin:6px 0 16px;padding:12px;border-radius:var(--r-m);background:var(--ambre-pale)}
.favs-tete{display:flex;justify-content:space-between;align-items:center;color:#7A4A05}
.favs-tete b{display:flex;align-items:center;gap:6px;font-family:var(--display)}
.lien{color:#7A4A05;font-weight:700;font-size:.88rem;text-decoration:underline}
.favs-chips{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.favs-chips::-webkit-scrollbar{display:none}
.fav-chip{flex:none;padding:9px 14px;border-radius:999px;background:#fff;border:1.5px solid #F0D29E;font-weight:700;font-size:.88rem;color:var(--encre)}
.fav-chip.plus{background:transparent;border-style:dashed;color:#7A4A05}
.fav-carte{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:14px 16px;border-radius:var(--r-m);background:var(--carte);border:1.5px solid var(--trait)}

  onglets.forEach(b=>b.setAttribute('aria-current', b.dataset.vue===v ? 'page':'false'));
  placerIndic(onglets.findIndex(b=>b.dataset.vue===v), v==='ia');
  document.body.dataset.vue = v;   // la bulle de l'assistant se cache dans Prescri'Dent et dans l'assistant
  vPrescri.vu = null; animerProgression.prec = null;
  // iOS : fermer le clavier avant de changer d'écran, sinon les barres fixes peuvent rester décalées
  if(document.activeElement && document.activeElement!==document.body) document.activeElement.blur();
  ({accueil:vAccueil, prescri:vPrescri, medoc:()=>vMedoc(), scan:vScan, code:vCode, ia:vIA})[v]();
  window.scrollTo(0,0);
}
document.querySelectorAll('.onglet').forEach(b=>b.onclick=()=>aller(b.dataset.vue));
function placerIndic(i, ia){
  const el=$('.indic'); if(!el) return;
  el.style.opacity = i<0 ? '0' : '';   // assistant : aucun onglet actif
  if(i<0) return;
  el.classList.toggle('ia', ia);
  const x=i*100+'%';
  if(!MOTION){ el.style.transform=`translateX(${x})`; return; }
  anime(el, {x}, placerIndic.fait ? {type:'spring', visualDuration:.35, bounce:.15} : {duration:0});
  placerIndic.fait = true;
}

/* ---------------------------------------------------------
   Prescri'Dent : questionnaire (règles dans recos.js)
--------------------------------------------------------- */
let P = {i:0, rep:{}, lignesOff:new Set(), sens:1, ajouts:[], filtre:{}};
const nouveauP = () => ({i:0, rep:{}, lignesOff:new Set(), sens:1, ajouts:[], filtre:{}});

function etapes(){
  const r=P.rep, M=RECO.MOTIF[r.motif]||{}, L=[];
  L.push({id:'motif', titre:'Pour quel acte ou quelle affection ?', aide:'Une seule réponse.', type:'un', groupes:RECO.MOTIFS});
  if(RECO.AVEC_EXTENSION.includes(r.motif)) L.push({id:'extension', titre:'Signes d’extension ?', aide:'Ils décident de l’antibiotique. Plusieurs réponses possibles.', type:'multi', aucun:'aucun', options: r.motif==='alveolite_suppuree' ? RECO.EXTENSION.filter(o=>o.v!=='suppuration') : RECO.EXTENSION});
  if(r.motif==='cellulite') L.push({id:'gravite', titre:'Signes de gravité ?', aide:'Un seul suffit pour adresser à l’hôpital.', type:'multi', aucun:'aucun', options:RECO.GRAVITE_CELLULITE});
  if(r.motif==='implant') L.push({id:'implant', titre:'Pose complexe ?', aide:'Plusieurs réponses possibles.', type:'multi', aucun:'aucun', options:RECO.IMPLANT_FACTEURS});
  L.push({id:'profil', titre:'Qui est le patient ?', aide:'Une seule réponse.', type:'un', options:[
    {v:'adulte',t:'Adulte',d:''},{v:'enfant',t:'Enfant',d:'Doses calculées au poids'},{v:'enceinte',t:'Femme enceinte',d:''},{v:'allaite',t:'Femme qui allaite',d:''}]});
  L.push({id:'allergies', titre:'Allergies connues ?', aide:'Plusieurs réponses possibles.', type:'multi', aucun:'aucune', options:RECO.ALLERGIES});
  L.push({id:'atcd', titre:'Antécédents médicaux et chirurgicaux ?', aide:'Plusieurs réponses possibles. Touche une pathologie : ses précisions s’ouvrent juste en dessous.', type:'multi', aucun:'aucun', groupes:RECO.ATCD});
  L.push({id:'ttt', titre:'Traitements et thérapies en cours ?', aide:'Médicaments, chimiothérapie, radiothérapie, hormonothérapie… Touche une classe pour préciser la molécule.', type:'multi', aucun:'aucun', groupes:RECO.TTT});
  return L;
}
function etapeValide(e){
  const r=P.rep, v=r[e.id];
  if(e.type==='multi' ? !(v&&v.length) : !v) return false;
  if(e.id==='profil' && v==='enfant') return Number(r.poids)>0 && Number(r.age)>=0 && r.age!=='' && r.age!=null;
  if(e.id==='profil' && v==='enceinte') return !!r.terme;
  if((e.id==='atcd' || e.id==='ttt') && RECO.manquants(r, e.id).length) return false;
  if(e.id==='ttt' && besoinRisqueHemo()) return !!r.risque_hemo;
  return true;
}
const CLASSES_AT = ['antiplaq','avk','aod','heparine'];
function besoinRisqueHemo(){
  const r=P.rep, M=RECO.MOTIF[r.motif]||{};
  return !!M.chir && (r.ttt||[]).some(x=>CLASSES_AT.includes(x));
}
/* Le choix du risque hémorragique s'ouvre sous le premier antithrombotique coché */
function hoteRisque(){ return besoinRisqueHemo() ? (P.rep.ttt||[]).find(v=>CLASSES_AT.includes(v)) : null; }   // le premier coché le garde
function blocsDe(o, e){
  const b = [...(o.sous||[])];
  if(e.id==='ttt' && hoteRisque()===o.v) b.unshift(RECO.BLOC_RISQUE);
  return b;
}
function blocHTML(b){
  const r = P.rep[b.k], vals = Array.isArray(r) ? r : (r ? [r] : []);
  return `<div class="bloc${b.grand?' grand':''}" data-k="${b.k}" data-type="${b.type}"${b.requis?' data-requis="1"':''}>
    <p class="bloc-t">${b.titre}${b.requis?`<span class="requis"${vals.length?' hidden':''}>À préciser</span>`:''}</p>
    <div class="puces">${b.options.map(x=>`<button type="button" class="puce" data-pv="${x.v}" aria-pressed="${vals.includes(x.v)}"><b>${x.t}</b>${x.d?`<small>${x.d}</small>`:''}</button>`).join('')}</div></div>`;
}
function panneauHTML(o, e){
  const b = blocsDe(o, e);
  return b.length ? `<div class="precis" data-pour="${o.v}" data-sig="${b.map(x=>x.k).join(',')}">${b.map(blocHTML).join('')}</div>` : '';
}
const motsOption = o => [o.mots||'', ...(o.sous||[]).flatMap(b=>b.options.map(x=>x.t+' '+x.d))].join(' ').trim();
/* Ouverture et fermeture animées des précisions */
function deplier(p){
  if(!MOTION || sansMouvement.matches) return;
  const cs = getComputedStyle(p), h = p.scrollHeight;
  p.style.overflow = 'hidden';
  MOTION.animate(p, {height:[0, h+'px'], paddingTop:['0px', cs.paddingTop], paddingBottom:['0px', cs.paddingBottom], opacity:[0,1]}, {duration:.34, ease:[.22,1,.36,1]})
    .finished.then(()=>{ ['height','paddingTop','paddingBottom','overflow','opacity'].forEach(k=>p.style[k]=''); }, ()=>{});
  MOTION.animate(p.querySelectorAll('.bloc'), {opacity:[0,1], y:[-8,0]}, {duration:.32, delay:MOTION.stagger(.06, {startDelay:.05}), ease:[.22,1,.36,1]});
}
function replier(p){
  p.dataset.ferme = '1';
  if(!MOTION || sansMouvement.matches){ p.remove(); return; }
  p.style.overflow = 'hidden';
  MOTION.animate(p, {height:[p.offsetHeight+'px', '0px'], paddingTop:'0px', paddingBottom:'0px', opacity:0}, {duration:.22, ease:[.4,0,1,1]})
    .finished.then(()=>p.remove(), ()=>p.remove());
}
/* Ouvre, ferme ou met à jour les précisions selon les options cochées */
function majPanneaux(e){
  app.querySelectorAll('.choix .opt[data-v]').forEach(btn=>{
    const o = e.groupes ? e.groupes.flatMap(g=>g.items).find(x=>x.v===btn.dataset.v) : null;
    let p = btn.nextElementSibling;
    if(!(p && p.classList.contains('precis'))) p = null;
    if(p && p.dataset.ferme){ p.remove(); p = null; }
    const on = btn.getAttribute('aria-pressed')==='true';
    const blocs = o && on && o.v!==e.aucun ? blocsDe(o, e) : [];
    if(blocs.length){
      const sig = blocs.map(x=>x.k).join(',');
      if(!p){ btn.insertAdjacentHTML('afterend', panneauHTML(o, e)); p = btn.nextElementSibling; p.hidden = btn.hidden; deplier(p); }
      else if(p.dataset.sig !== sig){ p.outerHTML = panneauHTML(o, e); }
    } else if(p) replier(p);
  });
}
/* Met à jour les puces et les mentions « À préciser » */
function majBlocs(){
  app.querySelectorAll('.precis .bloc').forEach(bl=>{
    const r = P.rep[bl.dataset.k], vals = Array.isArray(r) ? r : (r ? [r] : []);
    bl.querySelectorAll('.puce').forEach(pu=>pu.setAttribute('aria-pressed', vals.includes(pu.dataset.pv)));
    const q = bl.querySelector('.requis'); if(q) q.hidden = !!vals.length;
  });
}
/* Bouton Continuer : désactivé, ou orange s'il ne manque que des précisions */
function majSuiv(e){
  const b = $('#suiv'); if(!b) return;
  const ok = etapeValide(e);
  const manque = !ok && (e.id==='atcd' || e.id==='ttt') && (P.rep[e.id]||[]).length>0;
  b.disabled = !ok && !manque;
  b.classList.toggle('a-preciser', manque);
  b.textContent = manque ? 'Précise les choix en orange' : b.dataset.label;
}

function optHTML(o, e, rep){
  const on = e.type==='multi' ? (rep||[]).includes(o.v) : rep===o.v;
  const mots = (e.id==='atcd' || e.id==='ttt') ? motsOption(o) : '';
  return `<button class="opt ${e.type==='multi'?'multi':''}" data-v="${o.v}" aria-pressed="${on}"${mots?` data-mots="${esc(mots)}"`:''}><span class="coche"></span><span><b>${o.t}</b>${o.d?`<small>${o.d}</small>`:''}</span></button>`
    + (on && e.type==='multi' && o.v!==e.aucun && (e.id==='atcd' || e.id==='ttt') ? panneauHTML(o, e) : '');
}
const ICO_COCHE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7"/></svg>';
const fracProgression = (n, i) => n>1 ? Math.min(1, i/(n-1)) : 1;
function progressionHTML(n, i){
  return `<div class="progression" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${Math.min(i,n)}" aria-label="Question ${Math.min(i+1,n)} sur ${n}">
    <div class="prog-rail"><div class="prog-plein" style="transform:scaleX(${fracProgression(n,i)})"></div></div>
    <ol class="prog-etapes">${Array.from({length:n},(_,k)=>`<li class="${k<i?'fait':k===i?'cours':''}">${k<i?ICO_COCHE:k+1}</li>`).join('')}</ol></div>`;
}
function animerProgression(n, i){
  const prec = animerProgression.prec;
  animerProgression.prec = i;
  if(prec==null || prec===i) return;
  anime($('.prog-plein',app), {scaleX:[fracProgression(n,prec), fracProgression(n,i)]}, {duration:.55, ease:[.22,1,.36,1]});
  if(i>prec){
    const li = app.querySelectorAll('.prog-etapes li')[i-1];
    anime(li, {scale:[.5,1]}, {type:'spring', bounce:.55, visualDuration:.35});
    anime($('.prog-etapes li.cours',app), {scale:[.85,1]}, {type:'spring', bounce:.4, visualDuration:.4});
  }
}
let sortieQ = null;
function vPrescri(){
  sortieQ = null;
  const L = etapes();
  if(P.i >= L.length){ vPrescri.vu = null; vOrdo(); animerProgression(L.length, L.length); return; }
  const e = L[P.i], rep = P.rep[e.id];
  const progression = progressionHTML(L.length, P.i);
  const avecRecherche = ['motif','allergies','atcd','ttt'].includes(e.id);
  const tous = e.groupes ? e.groupes.flatMap(g=>g.items) : e.options;
  const epingle = e.aucun ? tous.find(o=>o.v===e.aucun) : null;   // « Aucune allergie », « Aucun antécédent »… en haut
  const horsEpingle = o => o!==epingle;
  let corps = (epingle?`<div class="epingle">${optHTML(epingle,e,rep)}</div>`:'')
    + (e.groupes ? e.groupes.map(g=>{ const it=g.items.filter(horsEpingle); return it.length?`<div class="grp"><p class="groupe">${g.groupe}</p>${it.map(o=>optHTML(o,e,rep)).join('')}</div>`:''; }).join('')
                 : `<div class="grp">${e.options.filter(horsEpingle).map(o=>optHTML(o,e,rep)).join('')}</div>`)
    + (avecRecherche?'<p class="sous rien" hidden>Aucun résultat. Essaie un autre mot.</p>':'');
  let extra='';
  if(e.id==='profil' && rep==='enfant') extra = `<div class="deux"><div class="champ"><label for="age">Âge (ans)</label><input id="age" inputmode="numeric" value="${esc(P.rep.age??'')}" placeholder="ex. 8"></div><div class="champ"><label for="poids">Poids (kg)</label><input id="poids" inputmode="decimal" value="${esc(P.rep.poids??'')}" placeholder="ex. 25"></div></div>`;
  if(e.id==='profil' && rep==='enceinte') extra = `<p class="groupe">Terme</p><div class="seg" data-k="terme">${[['avant','Avant le 6e mois'],['apres','6e mois ou plus (≥ 24 SA)']].map(([v,t])=>`<button data-v="${v}" aria-pressed="${P.rep.terme===v}">${t}</button>`).join('')}</div>`;

  app.innerHTML = `<div class="vue-q">
    <header class="top">
      ${P.i>0 ? `<button class="retour" id="prec">${ICO.retour}Retour</button>` : `<div class="logo">${logo}Prescri'Dent</div>`}
      <button class="retour" id="raz" style="padding-left:12px">Recommencer</button>
    </header>
    ${progression}
    <p class="etape-n">Question ${P.i+1} sur ${L.length}</p>
    <section class="question">
      ${P.i===0?bandeauFavoris():''}
      <h2>${e.titre}</h2><p class="sous">${e.aide}</p>
      ${e.id==='ttt'?`<button class="lien-scan" id="versScan">${ICO_SCAN}Scanner l’ordonnance du patient</button>`:''}
      ${avecRecherche?`<div class="recherche q-rech">${ICO.loupe}<input id="filtreQ" type="search" placeholder="${e.id==='motif'?'Rechercher un acte ou une affection':e.id==='allergies'?'Rechercher une allergie':e.id==='atcd'?'Pathologie, chirurgie (ex. Crohn, stent)':'Médicament ou classe (ex. Eliquis, metformine)'}" value="${esc(P.filtre[e.id]||'')}" autocomplete="off"></div>`:''}
      <div class="choix">${corps}</div>
      <div class="choix" style="margin-top:6px">${extra}</div>
    </section>
  </div>
  <div class="barre-action"><div class="in"><button class="btn" id="suiv" data-label="${P.i===L.length-1?'Voir la conduite à tenir':'Continuer'}">${P.i===L.length-1?'Voir la conduite à tenir':'Continuer'}</button></div></div>`;
  majSuiv(e);

  animerProgression(L.length, P.i);
  if(vPrescri.vu !== e.id) anime($('.question',app), {opacity:[0,1], x:[P.sens>0?28:-28, 0]}, RESSORT);
  vPrescri.vu = e.id;
  const vs=$('#versScan'); if(vs) vs.onclick=()=>{ SC=nouveauSC(); SC.depuisPrescri=true; aller('scan'); };
  if(P.i===0) brancherBandeau();
  const fq=$('#filtreQ'); if(fq){ const f=()=>{ P.filtre[e.id]=fq.value; filtrerOptions(fq.value); }; fq.oninput=f; filtrerOptions(fq.value); }
  app.querySelectorAll('.opt[data-v]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(e.type==='un'){
      P.rep[e.id]=v;
      app.querySelectorAll('.opt[data-v]').forEach(x=>x.setAttribute('aria-pressed', x===b));
      const sousChamp = (e.id==='profil' && (v==='enfant'||v==='enceinte'));
      if(sousChamp){ vPrescri(); return; }
      majSuiv(e);
      clearTimeout(vPrescri.t); vPrescri.t=setTimeout(suivant, 550);
    } else {
      let r=[...(P.rep[e.id]||[])];
      if(v===e.aucun) r = r.includes(v)?[]:[v];
      else { r=r.filter(x=>x!==e.aucun); r = r.includes(v)? r.filter(x=>x!==v) : [...r,v]; }
      P.rep[e.id]=r;
      app.querySelectorAll('.opt[data-v]').forEach(x=>x.setAttribute('aria-pressed', r.includes(x.dataset.v)));
      if(e.id==='atcd' || e.id==='ttt') majPanneaux(e);
      majSuiv(e);
    }
  });
  // précisions (délégation : les panneaux s'ouvrent et se ferment)
  const zoneQ = app.querySelector('.question .choix');

  });

  ['age','poids'].forEach(id=>{ const i=$('#'+id); if(i) i.oninput=()=>{ P.rep[id]=i.value.replace(',','.'); majSuiv(e); }; });
  $('#suiv').onclick=suivant;
  if($('#prec')) $('#prec').onclick=()=>{ clearTimeout(vPrescri.t); P.sens=-1; P.i--; vPrescri(); window.scrollTo(0,0); };
  $('#raz').onclick=()=>{ clearTimeout(vPrescri.t); P=nouveauP(); vPrescri(); };
}
/* Recherche dans les options d'une question (sans accents, tous les mots, synonymes courants) */
const SYN_Q = {extraction:'avulsion', extraire:'avulsion', extrait:'avulsion', sagesse:'incluse', canal:'endodont', devitalisation:'endodont', devit:'endodont', abces:'abces', implants:'implant', gencive:'gingiv', mycose:'candid', muguet:'candid', bouton:'herpes', aphte:'aphte', sinus:'sinus', morsure:'morsure', choc:'trauma', fracture:'fracture', anticoagulant:'anticoagulant', eliquis:'eliquis', xarelto:'xarelto', kardegic:'kardegic', plavix:'plavix', coeur:'cardi', cardiaque:'cardi', cancer:'malign', diabetique:'diabet', greffe:'greffe', valve:'valv', penicilline:'penicill', amoxicilline:'penicill'};
const normQ = t => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,' ');
function filtrerOptions(q){
  const mots=normQ(q).split(/\s+/).filter(Boolean);
  let n=0;
  app.querySelectorAll('.choix .grp').forEach(g=>{
    const titreG=normQ(g.querySelector('.groupe')?.textContent||'');
    let vis=0;
    g.querySelectorAll('.opt[data-v]').forEach(o=>{
      const t=normQ(o.textContent+' '+(o.dataset.mots||''))+' '+titreG;
      const ok=!mots.length || mots.every(w=>t.includes(w) || (SYN_Q[w] && t.includes(SYN_Q[w])));
      o.hidden=!ok; if(ok) vis++;
      const p=o.nextElementSibling; if(p && p.classList.contains('precis')) p.hidden=!ok;
    });
    g.hidden=!vis; n+=vis;
  });
  const r=app.querySelector('.choix .rien'); if(r) r.hidden=!!n || !mots.length;
}
function suivant(){
  clearTimeout(vPrescri.t);
  if(sortieQ) return;
  const L=etapes();
  if(P.i<L.length && !etapeValide(L[P.i])){
    const bl=[...app.querySelectorAll('.precis .bloc[data-requis]')].find(b=>!b.querySelector('.requis')?.hidden);
    if(bl){ bl.scrollIntoView({behavior:sansMouvement.matches?'auto':'smooth', block:'center'}); bl.classList.remove('attire'); void bl.offsetWidth; bl.classList.add('attire'); }
    return;
  }
  const q=app.querySelector('.question');
  const go=()=>{ P.sens=1; P.i++; P.lignesOff=new Set(); P.decochesFaits=false; vPrescri(); window.scrollTo(0,0); };
  const a=anime(q, {opacity:0, x:-24}, {duration:.18, ease:'easeIn'});
  if(!a) return go();
  sortieQ=a;
  a.finished.then(()=>{ if(sortieQ!==a) return; sortieQ=null; if(q.isConnected) go(); }, ()=>{});
}

            <button class="vidal retirer" data-retirer="${l.id}">Retirer de l’ordonnance</button></span>
        </div>` : `
        <button class="ligne" data-id="${l.id}" aria-pressed="${!P.lignesOff.has(l.id)}">
          <span class="coche"></span>
          <span style="text-align:left"><small class="sous" style="font-size:.78rem">${l.cat}</small>
            <span class="med" style="display:block">${l.med}</span>
            <span class="pos" style="display:block">${l.pos} · ${l.qsp}</span>
            <a class="vidal" href="#" data-mx="${esc(l.med)}">Fiche Médicodex</a></span>
        </button>`;
  app.innerHTML = `<div class="vue">
    <header class="top"><button class="retour" id="prec">${ICO.retour}Retour</button><button class="retour" id="raz" style="padding-left:12px">Nouveau patient</button></header>
    ${progressionHTML(etapes().length, etapes().length)}
    <section class="question fin" style="padding-bottom:120px">
      ${cadreHTML('Conduite à tenir', `
        <div class="verdict ${O.atb?'oui':'non'}"><b>${O.atb?'Antibiotique : oui':'Antibiotique : non'}</b>${O.pourquoi.map(x=>`<p>${x}</p>`).join('')}</div>
        ${alertesGroupees([
          ...(O.hospit?[{n:'forte', html:'<b>Prise en charge hospitalière</b>Adresser le patient aux urgences ou en chirurgie maxillo-faciale.'}]:[]),
          ...O.alertes.filter(x=>x.n!=='info').map(x=>({n:x.n, html:`<b>${x.t}</b>${x.d}`})),
          ...O.gestes.map(g=>({n:'info', geste:true, html:g})),
          ...O.alertes.filter(x=>x.n==='info').map(x=>({n:'info', html:`<b>${x.t}</b>${x.d}`})),
        ], {info: O.gestes.length?'Au fauteuil et bon à savoir':'Bon à savoir'})}`, esc(M.t||''))}
      ${cadreHTML('Ordonnance proposée', `
        <p class="sous">${toutes.length?'Touche une ligne pour la retirer ou la remettre.':'Aucun médicament recommandé pour cette situation.'}</p>

  ${toutes.length?`<div class="barre-action"><div class="in"><button class="btn" id="copierOrdo">Copier l’ordonnance</button></div></div>`:''}`;
  const majTexte=()=>{ const z=$('#ordoTexte'); if(z) z.innerHTML=htmlOrdo(actives()); };
  majTexte();
  const bascule=id=>{ P.lignesOff.has(id)?P.lignesOff.delete(id):P.lignesOff.add(id); app.querySelector(`.ligne[data-id="${id}"]`)?.setAttribute('aria-pressed', !P.lignesOff.has(id)); majTexte(); };

/* ---------------------------------------------------------
   Ordonnances types (favoris) — enregistrées sur ce téléphone uniquement (localStorage).
   Aucune donnée patient : seulement un nom, une option d'intitulé et des lignes de médicaments.
--------------------------------------------------------- */
const FAV_CLE = 'drill.ordostypes.v1';
function lireFavoris(){ try{ return JSON.parse(localStorage.getItem(FAV_CLE)) || []; }catch(e){ return []; } }
function ecrireFavoris(L){ try{ localStorage.setItem(FAV_CLE, JSON.stringify(L)); return true; }catch(e){ toast('Enregistrement impossible sur cet appareil'); return false; } }
const ICO_ETOILE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
function texteFavori(f){
  const t=[]; if(f.intitule && f.nom) t.push(f.nom);
  f.lignes.forEach((l,i)=>t.push(`${i+1}/ ${l.titre}\n${l.pos}${l.pos && !/[.!]$/.test(l.pos)?'.':''}${l.horsAMM?'\nPrescription hors autorisation de mise sur le marché.':''}`));
  if(f.unite) t.push('Antibiotique à délivrer à l’unité.');
  return t.join('\n\n');
}
function htmlFavori(f){
  let h = (f.intitule && f.nom) ? `<div class="ol"><b class="intitule">${esc(f.nom)}</b></div>` : '';
  h += f.lignes.map((l,i)=>`<div class="ol"><b>${i+1}/ ${esc(l.titre)}</b><span>${esc(l.pos)}</span>${l.horsAMM?'<span>Prescription hors autorisation de mise sur le marché.</span>':''}</div>`).join('');
  if(f.unite) h += '<div class="ol"><span>Antibiotique à délivrer à l’unité.</span></div>';
  return h || '<p class="sous">Aucun médicament pour l’instant.</p>';
}

  const favs=lireFavoris();

    <div class="favs-tete"><b>${ICO_ETOILE} Mes ordonnances types</b>${favs.length?'<button class="lien" id="favTout">Tout voir</button>':''}</div>

}
function brancherBandeau(){
  app.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>vFavDetail(b.dataset.fav));

const FICHES = {};
async function ficheRCP(cis){
  if(!cis) return null; if(FICHES[cis]) return FICHES[cis];
  try{ const r=await fetch(IA_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'fiche', cis:[cis]})}); const j=await r.json(); const f=j.fiches?.[0]; if(f && !f.erreur){ FICHES[cis]=f; return f; } }catch(e){}
  return null;
}

/* Ordonnance : texte à recopier sur l'ordonnance du service (aucun document généré).
   Ordre usuel : traitement étiologique (anti-infectieux), symptomatique (antalgiques), local (bain de bouche).
   Présentations : dosages et formes vérifiés dans la base de données publique des médicaments (ANSM). */
const ORDRE_ORDO = c => /^Antibioprophylaxie/.test(c)?0 : c==='Antibiotique'?1 : c==='Antifongique'?2 : c==='Antiviral'?3 : c==='Antalgique'?4 : c==='Anti-inflammatoire'?5 : c==='Antiseptique'?6 : 7;
const rangOrdo = l => l.ordre ?? ORDRE_ORDO(l.cat);
const trierLignes = L => L.map((l,i)=>({l,i})).sort((a,b)=>rangOrdo(a.l)-rangOrdo(b.l)||a.i-b.i).map(x=>x.l);
// [dosage en mg, intitulé, unité de prise] du plus fort au plus faible ; buv = suspension (mg par mL)
const PRESENTATIONS = {
  'Amoxicilline': {cp:[[1000,'Amoxicilline 1 g, comprimé dispersible','comprimé'],[500,'Amoxicilline 500 mg, gélule','gélule']], buv:['Amoxicilline 500 mg/5 mL, poudre pour suspension buvable',100]},
  'Amoxicilline + acide clavulanique': {cp:[[1000,'Amoxicilline/acide clavulanique 1 g/125 mg, poudre pour suspension buvable en sachet-dose','sachet']], buv:['Amoxicilline/acide clavulanique 100 mg/12,5 mg par mL ENFANTS, poudre pour suspension buvable',100]},
  'Métronidazole': {cp:[[500,'Métronidazole 500 mg, comprimé pelliculé','comprimé'],[250,'Métronidazole 250 mg, comprimé pelliculé','comprimé']], buv:['Métronidazole 125 mg/5 mL, suspension buvable',25]},
  'Clarithromycine': {cp:[[500,'Clarithromycine 500 mg, comprimé pelliculé','comprimé']], buv:['Clarithromycine 50 mg/mL, granulés pour suspension buvable',50]},
  'Azithromycine': {cp:[[250,'Azithromycine 250 mg, comprimé pelliculé','comprimé']], buv:['Azithromycine 40 mg/mL, poudre pour suspension buvable',40]},
  'Pristinamycine': {cp:[[500,'Pristinamycine 500 mg, comprimé pelliculé','comprimé'],[250,'Pristinamycine 250 mg, comprimé pelliculé','comprimé']]},
  'Cefpodoxime proxétil': {cp:[[100,'Cefpodoxime 100 mg, comprimé pelliculé','comprimé']], buv:['Cefpodoxime 40 mg/5 mL, poudre pour suspension buvable',8]},
  'Clindamycine': {cp:[[300,'Clindamycine 300 mg, gélule','gélule'],[150,'Clindamycine 150 mg, gélule','gélule']]},
  'Paracétamol': {cp:[[1000,'Paracétamol 1 g, comprimé','comprimé'],[500,'Paracétamol 500 mg, gélule','gélule']], buv:['Paracétamol 2,4 %, suspension buvable',24]},
  'Ibuprofène': {cp:[[400,'Ibuprofène 400 mg, comprimé pelliculé','comprimé'],[200,'Ibuprofène 200 mg, comprimé pelliculé','comprimé']], buv:['Ibuprofène 20 mg/mL, suspension buvable',20]},
};
const INTITULES = [
  [/^Chlorhexidine/,'Chlorhexidine digluconate 0,12 %, solution pour bain de bouche'],
  [/Loramyc/,'Miconazole 50 mg, comprimé gingival muco-adhésif'],
  [/Daktarin/,'Miconazole 2 %, gel buccal'],
  [/^Amphotéricine/,'Amphotéricine B 10 %, suspension buvable'],
  [/^Aciclovir/,'Aciclovir 200 mg/5 mL, suspension buvable'],
];
const nombreFR = n => String(Math.round(n*100)/100).replace('.',',');
const enMg = (v,u) => parseFloat(v.replace(/\s/g,'').replace(',','.'))*(u==='g'?1000:1);
const RX_DOSE = /(\d+(?:[ ,]\d+)?)\s?(mg|g)\b(?!\s*\/\s*kg)/g;
function dureeOrdo(qsp){
  const q=qsp.replace(/\s*\(.*?\)\s*/g,' ').replace(/,.*$/,'').trim();
  if(/unique/i.test(q)) return '';
  const m=q.match(/^(.*?)\s+au moins$/i); if(m) return 'pendant au moins '+m[1];
  return 'pendant '+q.toLowerCase();
}
function formaterLigne(l){
  if(l.ajout){ const pos=l.pos.charAt(0).toUpperCase()+l.pos.slice(1); return {titre:l.med, pos:/[.!]$/.test(pos)?pos:pos+'.', horsAMM:false}; }
  // HAS juillet 2026, tableaux 11 et 12 : l'antibioprophylaxie en pratique bucco-dentaire est hors AMM (adulte et enfant)
  const horsAMM=/hors AMM/i.test(l.med) || /^Antibioprophylaxie/.test(l.cat), buvable=/forme buvable/i.test(l.med);
  const base=l.med.replace(/\s*\(.*?\)\s*/g,' ').trim();
  let pos=l.pos.replace(/\s*\((?![^)]*\bmL\b)[^)]*\)/g,'').replace(/\s+/g,' ').trim();   // on garde « (5 mL) », on retire les notes de calcul
  const P=PRESENTATIONS[base]; let titre=base;
  const fixe=INTITULES.find(([rx])=>rx.test(l.med)); if(fixe) titre=fixe[1];
  if(P && !/renseigner le poids/i.test(l.pos)){
    pos=pos.replace(/\s*\/\s*125 mg/,'').replace(/\s*\(équivalent amoxicilline\)/,'');
    const doses=[...pos.matchAll(RX_DOSE)].map(m=>enMg(m[1],m[2]));
    const pres=P.cp.find(([mg])=>doses.length && doses.every(d=>d%mg===0));
    if((buvable || !pres) && P.buv){
      titre=P.buv[0];
      pos=pos.replace(RX_DOSE,(m,v,u)=>`${m} (soit ${nombreFR(enMg(v,u)/P.buv[1])} mL)`);
    } else if(pres){
      const [mg,t,u]=pres; titre=t;
      pos=pos.replace(RX_DOSE,(m,v,un)=>{ const n=enMg(v,un)/mg; return `${n} ${u}${n>1?'s':''}`; });
    } // sinon : dose en mg sans forme imposée (le pharmacien choisit le dosage adapté)
  }
  const d=dureeOrdo(l.qsp);
  pos=pos.charAt(0).toUpperCase()+pos.slice(1);
  if(d) pos+=(/,$/.test(pos)?' ':', ')+d;
  return {titre, pos:pos.replace(/\s+,/g,',')+'.', horsAMM};
}
function blocsOrdo(lignes){
  const out=[];
  trierLignes(lignes).forEach(l=>{
    if(l.med==='Amoxicilline + métronidazole'){ // bithérapie : deux lignes distinctes sur l'ordonnance
      [['Amoxicilline','500 mg 3 fois par jour'],['Métronidazole','500 mg 3 fois par jour']].forEach(([m,p])=>out.push(formaterLigne({...l,med:m,pos:p})));
    } else out.push(formaterLigne(l));
  });
  return out;
}
function texteOrdo(lignes){
  if(!lignes.length) return '';
  const blocs=blocsOrdo(lignes).map((b,i)=>`${i+1}/ ${b.titre}\n${b.pos}${b.horsAMM?'\nPrescription hors autorisation de mise sur le marché.':''}`);
  if(lignes.some(l=>/^Antibioprophylaxie/.test(l.cat))) blocs.push('Antibiotique à délivrer à l’unité.');
  return blocs.join('\n\n');
}
function htmlOrdo(lignes){
  if(!lignes.length) return '<p class="sous">Aucune ligne sélectionnée.</p>';
  let h=blocsOrdo(lignes).map((b,i)=>`<div class="ol"><b>${i+1}/ ${esc(b.titre)}</b><span>${esc(b.pos)}</span>${b.horsAMM?'<span>Prescription hors autorisation de mise sur le marché.</span>':''}</div>`).join('');
  if(lignes.some(l=>/^Antibioprophylaxie/.test(l.cat))) h+='<div class="ol"><span>Antibiotique à délivrer à l’unité.</span></div>';
  return h;
}
async function copierTexte(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const z=document.createElement('textarea'); z.value=t; z.setAttribute('readonly',''); z.style.position='fixed'; z.style.opacity='0'; document.body.appendChild(z); z.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} z.remove(); return ok;
  }
}

/* Saisie de date au clavier : JJ/MM/AAAA */
function brancherDate(i, quandComplet){
  if(!i) return;
  i.addEventListener('input', ()=>{
    const ch=i.value.replace(/\D/g,'').slice(0,8);
    let v=ch.slice(0,2); if(ch.length>2) v+='/'+ch.slice(2,4); if(ch.length>4) v+='/'+ch.slice(4,8);
    i.value=v;
    if(quandComplet && v.length===10) quandComplet(v);
    if(quandComplet && v.length===0) quandComplet('');
  });
}
function dateISO(jjmmaaaa){
  const m=String(jjmmaaaa).match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(!m) return '';
  const d=new Date(`${m[3]}-${m[2]}-${m[1]}T12:00`); if(isNaN(d) || d.getDate()!==Number(m[1])) return '';
  return `${m[3]}-${m[2]}-${m[1]}`;
}
