<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BD0B0"/>
      <stop offset=".42" stop-color="#0E9384"/>
      <stop offset="1" stop-color="#0A3556"/>
    </linearGradient>
    <radialGradient id="halo1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7FF5DD" stop-opacity=".55"/><stop offset="1" stop-color="#7FF5DD" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#062B45" stop-opacity=".6"/><stop offset="1" stop-color="#062B45" stop-opacity="0"/></radialGradient>
    <radialGradient id="ombre" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#04243A" stop-opacity=".5"/><stop offset="1" stop-color="#04243A" stop-opacity="0"/></radialGradient>
    <linearGradient id="email" x1=".1" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#EEF9F6"/>
      <stop offset="1" stop-color="#B9E4DA"/>
    </linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
